<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex 用量悬浮条｜使用视频</title>
  <style>
    :root { color-scheme: light; --bg:#e5ecee; --surface:#fbfbf8; --line:#c9d2d5; --ink:#17202a; --muted:#647179; --green:#1f8a70; --blue:#2864dc; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); }
    a { color:inherit; }
    .topbar { display:flex; min-height:58px; align-items:center; justify-content:space-between; gap:14px; padding:9px clamp(14px,3vw,38px); border-bottom:1px solid var(--line); background:#f7f9f8; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:900; }
    .mark { display:grid; width:34px; height:34px; place-items:center; border-radius:7px; color:#fff; font-size:10px; background:var(--green); }
    .topbar nav { display:flex; flex-wrap:wrap; gap:7px; }
    .topbar nav a,.button { display:inline-flex; min-height:35px; align-items:center; justify-content:center; padding:0 12px; border:1px solid var(--line); border-radius:6px; color:#34414a; text-decoration:none; font-size:12px; font-weight:800; background:#fff; }
    main { width:min(1080px,calc(100% - 28px)); margin:0 auto; padding:34px 0 48px; }
    .heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:16px; }
    .eyebrow { color:var(--green); font-size:10px; font-weight:900; letter-spacing:.12em; }
    h1 { margin:6px 0 7px; font-size:clamp(28px,5vw,46px); letter-spacing:0; }
    p { margin:0; color:var(--muted); line-height:1.7; }
    .duration { flex:0 0 auto; padding:7px 10px; border:1px solid rgba(31,138,112,.3); border-radius:99px; color:var(--green); font-size:12px; font-weight:900; background:#f3faf7; }
    .viewer { overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:0 20px 60px rgba(42,58,63,.18); }
    .video-shell { display:grid; min-height:min(62vh,610px); place-items:center; background:#101820; }
    video { display:none; width:100%; max-height:72vh; background:#101820; }
    .load-card { width:min(520px,calc(100% - 28px)); padding:28px; border:1px solid #3d4b54; border-radius:8px; color:#fff; text-align:center; background:#1b2730; }
    .load-card strong { display:block; margin-bottom:8px; font-size:23px; }
    .load-card p { margin-bottom:17px; color:#c3cdd2; }
    .button { cursor:pointer; }
    .button.primary { border-color:var(--blue); color:#fff; background:var(--blue); }
    .viewer-actions { display:flex; flex-wrap:wrap; gap:8px; padding:12px; border-top:1px solid var(--line); }
    .chapters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .chapter { padding:14px 0; border-top:2px solid #9eacb2; }
    .chapter span { color:var(--green); font-size:11px; font-weight:900; }
    .chapter strong { display:block; margin:5px 0; }
    @media (max-width:720px) { .topbar,.heading { align-items:flex-start; flex-direction:column; } .topbar nav { width:100%; } .topbar nav a { flex:1; } .chapters { grid-template-columns:1fr; } .video-shell { min-height:48vh; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="mark">CQ</span><span>Codex 用量悬浮条</span></a>
    <nav><a href="../index.html">打开网页演示</a><a href="../../../index.html#apps">返回应用集合</a></nav>
  </header>
  <main>
    <section class="heading">
      <div><span class="eyebrow">QUICK WALKTHROUGH</span><h1>实时额度与桌面悬浮体验</h1><p>中文配音演示额度刷新、低额度颜色、折叠和托盘恢复。</p></div>
      <span class="duration">约 45 秒</span>
    </section>
    <section class="viewer" aria-label="Codex 用量悬浮条使用视频">
      <div class="video-shell">
        <div class="load-card" id="loadCard">
          <strong>准备播放使用视频</strong>
          <p>点击后加载，视频时长少于 1 分钟，包含中文配音和字幕。</p>
          <button id="loadVideo" class="button primary" type="button">加载并播放</button>
        </div>
        <video id="demoVideo" controls playsinline preload="none" data-src="./codex-quota-bar-demo.mp4">
          <track kind="captions" srclang="zh-CN" label="简体中文" src="./codex-quota-bar-demo.vtt" default />
          你的浏览器不支持 HTML5 视频。
        </video>
      </div>
      <div class="viewer-actions">
        <a class="button" href="./codex-quota-bar-demo.mp4">直接打开 MP4</a>
        <a class="button" href="../index.html">边看边体验</a>
        <a class="button" href="../../../downloads/CodexQuotaBar-Windows-x64.zip" download>Wins下载</a>
        <a class="button" href="../../../downloads/CodexQuotaBar-macOS.zip" download>Mac下载</a>
      </div>
    </section>
    <section class="chapters" aria-label="视频章节">
      <article class="chapter"><span>00:00</span><strong>实时额度</strong><p>查看 Codex 与 Spark 的剩余百分比和重置时间。</p></article>
      <article class="chapter"><span>00:10</span><strong>颜色提醒</strong><p>额度进入警告与危险区间时自动切换颜色。</p></article>
      <article class="chapter"><span>00:23</span><strong>折叠与托盘</strong><p>压缩为紧凑栏，隐藏后从托盘快速恢复。</p></article>
    </section>
  </main>
  <script>
    const button = document.querySelector("#loadVideo");
    const video = document.querySelector("#demoVideo");
    const card = document.querySelector("#loadCard");
    button.addEventListener("click", () => {
      if (!video.src) video.src = video.dataset.src;
      card.style.display = "none";
      video.style.display = "block";
      video.play().catch(() => video.load());
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>万话筒教学视频</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18202e;
        --muted: #647084;
        --line: #d9dee8;
        --paper: #f7f8fb;
        --panel: #ffffff;
        --blue: #246bfe;
        --green: #0f8f70;
        --shadow: 0 22px 60px rgba(28, 38, 58, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 86% 8%, rgba(36, 107, 254, 0.14), rgba(36, 107, 254, 0) 32%),
          radial-gradient(circle at 10% 92%, rgba(15, 143, 112, 0.13), rgba(15, 143, 112, 0) 34%),
          var(--paper);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      }

      .home-link {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid rgba(24, 32, 46, 0.12);
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 12px 30px rgba(28, 38, 58, 0.12);
        backdrop-filter: blur(14px);
      }

      .shell {
        width: min(1180px, calc(100vw - 36px));
        margin: 0 auto;
        padding: 78px 0 46px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 11px;
        border-radius: 999px;
        color: var(--blue);
        background: rgba(36, 107, 254, 0.08);
        font-size: 13px;
        font-weight: 900;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        margin-top: 12px;
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.08;
      }

      p {
        max-width: 680px;
        color: var(--muted);
        line-height: 1.72;
        font-size: 16px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .btn {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-weight: 900;
      }

      .btn.primary {
        color: #fff;
        border-color: var(--blue);
        background: var(--blue);
      }

      .video-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #111827;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
      }

      .meta div {
        min-height: 86px;
        padding: 18px;
        background: #fff;
      }

      .meta strong {
        display: block;
        margin-bottom: 8px;
        color: var(--green);
        font-size: 15px;
      }

      .meta span {
        color: #47546a;
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        header,
        .meta {
          grid-template-columns: 1fr;
          display: grid;
        }

        .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <a class="home-link" href="../../../index.html">返回主页</a>
    <main class="shell">
      <header>
        <div>
          <span class="eyebrow">万话筒教学视频</span>
          <h1>一句话，转出万种表达</h1>
          <p>这条视频介绍万话筒是什么、适合哪些表达场景，以及如何完成选择模式、输入内容、调整风格和复制结果。</p>
        </div>
        <nav class="actions" aria-label="相关入口">
          <a class="btn primary" href="../index.html">打开应用</a>
          <a class="btn" href="../../../index.html">返回主页</a>
        </nav>
      </header>

      <section class="video-card" aria-label="万话筒教学视频播放器">
        <video controls playsinline preload="metadata" src="./wanhuatong-tutorial.mp4">
          当前浏览器不支持视频播放，请直接打开 wanhuatong-tutorial.mp4。
        </video>
        <div class="meta">
          <div><strong>看完会知道</strong><span>万话筒如何把一句话改成更合适的表达。</span></div>
          <div><strong>主要流程</strong><span>选择模式、输入文本、调整语言风格、点击转换。</span></div>
          <div><strong>适用场景</strong><span>聊天沟通、说明改写、情书暗语、多语言和古风表达。</span></div>
        </div>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="集中审阅砖块角色名字、一句话概述与27字图鉴文案，并实时查看游戏内详情效果。">
  <title>砖块角色文案预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/subpage-shell.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2421;
      --muted: #69706c;
      --line: #d8ddd9;
      --paper: #ffffff;
      --canvas: #eef1ed;
      --red: #ed3f39;
      --red-dark: #b82725;
      --green: #76ad37;
      --yellow: #f3c94f;
      --charcoal: #242725;
      --focus: #2670cc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    input { font: inherit; }

    .copy-topbar {
      border-bottom: 4px solid var(--red);
      background: var(--charcoal);
      color: #fff;
    }

    .copy-topbar-inner {
      width: min(1480px, calc(100% - 40px));
      min-height: 86px;
      margin: 0 auto;
      padding-left: 154px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: #e7ebe8;
      font-size: 13px;
    }

    .summary span {
      padding: 5px 8px;
      border: 1px solid #626865;
      border-radius: 4px;
    }

    main {
      width: min(1480px, calc(100% - 40px));
      margin: 24px auto 40px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      align-items: start;
      gap: 20px;
    }

    .table-surface,
    .preview-surface {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 3px 12px rgb(28 35 31 / 8%);
    }

    .toolbar {
      min-height: 64px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar-title {
      min-width: 160px;
      font-size: 17px;
      font-weight: 750;
    }

    .search {
      width: min(320px, 48%);
      height: 38px;
      padding: 0 12px;
      border: 1px solid #bcc4bf;
      border-radius: 6px;
      color: var(--ink);
      background: #fafbfa;
      outline: none;
    }

    .search:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgb(38 112 204 / 14%);
    }

    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 198px);
    }

    table {
      width: 100%;
      min-width: 1030px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th,
    td {
      padding: 14px 14px;
      border-bottom: 1px solid #e4e8e5;
      text-align: left;
      vertical-align: top;
      line-height: 1.65;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: #4f5752;
      background: #f4f6f4;
      font-size: 13px;
      font-weight: 700;
    }

    tbody tr {
      cursor: pointer;
      background: #fff;
      transition: background-color 140ms ease;
    }

    tbody tr:hover { background: #fbf8ee; }
    tbody tr.selected { background: #fff5f3; }
    tbody tr.selected td:first-child { box-shadow: inset 4px 0 0 var(--red); }
    tbody tr:last-child td { border-bottom: 0; }

    .col-code { width: 140px; }
    .col-image { width: 86px; text-align: center; }
    .col-name { width: 112px; }
    .col-summary { width: 270px; }
    .col-copy { width: auto; }
    .col-count { width: 72px; text-align: center; }
    .col-action { width: 72px; text-align: center; }

    .code-label {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid #c9d0cc;
      border-radius: 4px;
      color: #414844;
      background: #f7f8f7;
      font-size: 13px;
      white-space: nowrap;
    }

    .role-name {
      color: #c92f2c;
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .role-thumb {
      display: block;
      width: 62px;
      height: 62px;
      margin: 0 auto;
      border: 1px solid #cfd5d1;
      border-radius: 6px;
      background: #252825;
      object-fit: contain;
    }

    .role-thumb-empty {
      display: grid;
      width: 62px;
      height: 62px;
      margin: 0 auto;
      place-items: center;
      border: 1px dashed #c8ceca;
      border-radius: 6px;
      color: #858c87;
      background: #f7f8f7;
      font-size: 11px;
    }

    .copy-count {
      display: inline-flex;
      min-width: 42px;
      height: 26px;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: #255d2c;
      background: #e7f3e5;
      font-size: 12px;
      font-weight: 750;
    }

    .preview-btn {
      min-width: 48px;
      height: 30px;
      padding: 0 8px;
      border: 1px solid #bbb;
      border-radius: 5px;
      color: #333;
      background: #fff;
      cursor: pointer;
    }

    .preview-btn:hover,
    .preview-btn:focus-visible {
      border-color: var(--red);
      color: var(--red-dark);
      outline: none;
    }

    .preview-surface {
      position: sticky;
      top: 20px;
      color: #fff;
      background: #1f211f;
    }

    .preview-heading {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3a3e3b;
      font-size: 15px;
      font-weight: 750;
    }

    .preview-index {
      color: #bfc5c1;
      font-size: 12px;
      font-weight: 500;
    }

    .stage {
      position: relative;
      min-height: 630px;
      padding: 70px 24px 28px;
      overflow: hidden;
      background-color: #252825;
      background-image:
        linear-gradient(90deg, transparent 49%, rgb(255 255 255 / 3%) 50%, transparent 51%),
        linear-gradient(0deg, transparent 49%, rgb(255 255 255 / 3%) 50%, transparent 51%);
      background-size: 28px 28px;
    }

    .spotlight {
      position: absolute;
      top: 0;
      left: 50%;
      width: 260px;
      height: 430px;
      transform: translateX(-50%);
      clip-path: polygon(39% 0, 61% 0, 100% 100%, 0 100%);
      background: rgb(255 252 220 / 22%);
      pointer-events: none;
    }

    .ribbon {
      position: relative;
      z-index: 1;
      width: fit-content;
      min-width: 176px;
      max-width: 240px;
      margin: 0 auto;
      padding: 10px 22px;
      color: #fff;
      border: 2px solid #ff625c;
      background: var(--red);
      box-shadow: 0 8px 0 var(--red-dark);
      text-align: center;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 900;
      white-space: nowrap;
    }

    .character-slot {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 240px;
      margin: 28px auto 16px;
      display: grid;
      place-items: center;
    }

    .character {
      position: relative;
      width: 154px;
      height: 176px;
    }

    .character-image {
      display: block;
      width: min(280px, 100%);
      height: 240px;
      border-radius: 6px;
      object-fit: contain;
    }

    .character-image[hidden],
    .character[hidden] {
      display: none;
    }

    .tile {
      position: absolute;
      top: 0;
      left: 8px;
      width: 138px;
      height: 132px;
      overflow: hidden;
      border: 6px solid #111;
      border-radius: 10px;
      background: #e9f8a7;
      box-shadow: inset 14px 0 0 #91bc41, inset -8px -8px 0 rgb(93 131 49 / 20%);
    }

    .leaf {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 32px;
      height: 70px;
      border: 5px solid #396e10;
      border-radius: 70% 10% 65% 15%;
      background: #7bc51e;
      transform-origin: bottom center;
    }

    .leaf.a { transform: translateX(-50%) rotate(-35deg); }
    .leaf.b { transform: translateX(-50%) rotate(0deg); height: 82px; }
    .leaf.c { transform: translateX(-50%) rotate(35deg); }

    .foot {
      position: absolute;
      top: 126px;
      width: 34px;
      height: 47px;
      border-left: 5px solid #111;
      border-bottom: 9px solid #111;
      border-radius: 0 0 0 26px;
    }

    .foot.left { left: 42px; }
    .foot.right { right: 37px; }

    .shadow {
      position: absolute;
      z-index: 0;
      top: 354px;
      left: 50%;
      width: 205px;
      height: 32px;
      border-radius: 50%;
      background: rgb(255 255 255 / 72%);
      box-shadow: 0 0 28px rgb(255 250 210 / 48%);
      transform: translateX(-50%);
    }

    .copy-box {
      position: relative;
      z-index: 1;
      min-height: 166px;
      margin-top: 12px;
      padding: 18px 20px;
      border: 4px solid #111;
      border-radius: 8px;
      color: #1f211f;
      background: #f4f4f1;
    }

    .copy-kicker {
      margin-bottom: 8px;
      color: #727873;
      font-size: 12px;
      font-weight: 700;
    }

    .preview-summary {
      margin: 0 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #cfd4d0;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 650;
    }

    .preview-copy {
      margin: 0;
      font-size: 16px;
      line-height: 1.75;
      font-weight: 700;
    }

    .empty {
      padding: 56px 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; }
      .preview-surface { position: static; }
      .stage { min-height: 570px; }
      .table-wrap { max-height: none; }
    }

    @media (max-width: 680px) {
      .copy-topbar-inner,
      main { width: min(100% - 24px, 1480px); }
      .copy-topbar-inner { padding: 72px 0 16px; align-items: flex-start; flex-direction: column; }
      h1 { font-size: 23px; }
      .summary { justify-content: flex-start; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search { width: 100%; }
      .stage { padding-inline: 16px; }
    }
  </style>
</head>
<body class="hub-subpage">
  <a class="hub-home-link" href="../../index.html#apps">
    <span class="hub-home-link__icon" aria-hidden="true">←</span>

  <header class="copy-topbar">
    <div class="copy-topbar-inner">
      <h1>砖块角色图鉴文案预览</h1>
      <div class="summary" aria-label="文案规范">
        <span>20个角色</span>
        <span>新增10张形象</span>
        <span>职业组文案27字</span>
      </div>
    </div>
  </header>

  <main>
    <div class="workspace">
      <section class="table-surface" aria-labelledby="table-title">
        <div class="toolbar">
          <div class="toolbar-title" id="table-title">角色文案表</div>
          <input class="search" id="search" type="search" placeholder="搜索代号、名字或文案" aria-label="搜索角色文案">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-code">美术认知代号</th>
                <th class="col-image">角色形象</th>
                <th class="col-name">角色名字</th>
                <th class="col-summary">一句话概述</th>
                <th class="col-copy">详细文案</th>
                <th class="col-count">字数</th>
                <th class="col-action">效果</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden>没有匹配的角色文案</div>
        </div>
      </section>

      <aside class="preview-surface" aria-labelledby="preview-title">
        <div class="preview-heading">
          <span id="preview-title">游戏内详情效果</span>
          <span class="preview-index" id="preview-index">1 / 20</span>
        </div>
        <div class="stage">
          <div class="spotlight"></div>
          <div class="ribbon" id="preview-name">袋鼠团长</div>
          <div class="character-slot">
            <img class="character-image" id="preview-image" alt="" hidden>
            <div class="character" id="preview-placeholder" aria-hidden="true">
              <div class="tile">
                <span class="leaf a"></span>
                <span class="leaf b"></span>
                <span class="leaf c"></span>
              </div>
              <span class="foot left"></span>
              <span class="foot right"></span>
            </div>
          </div>
          <div class="shadow" id="preview-shadow" aria-hidden="true"></div>
          <div class="copy-box">
            <div class="copy-kicker" id="preview-code">美团骑手</div>
            <p class="preview-summary" id="preview-summary"></p>
            <p class="preview-copy" id="preview-copy"></p>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const roles = [
      {
        code: "美团骑手",
        name: "袋鼠团长",
        summary: "肚里不装宝宝，专装外卖和一句马上到。",

      {

        copy: "唱跳投篮样样都能整，球进不进不重要，气氛必须先拉满啦。"

      {

        copy: "西装一穿全场自动安静，他不亲自搬砖，只研究该谁来搬砖。"
      },
      {
        code: "格子衫程序员",
        name: "格码哥",
        summary: "表面安静写代码，心里正和需求打架。",
        copy: "白天和需求斗智，晚上跟报错拼命，头发是唯一删掉的代码。"
      },
      {
        code: "工地搬砖的",
        name: "搬砖本砖",
        summary: "别人搬砖是工作，他搬砖是在照顾同类。",
        copy: "别人搬砖是工作，他搬砖像照镜子，每一块都是失散的亲戚。"
      },
      {
        code: "餐厅服务生男",
        name: "端稳哥",
        summary: "盘子可以晃，脸上的职业微笑不能掉。",
        copy: "盘子端得稳，微笑挂得住，客人催得再急也得先说句您稍等。"
      },
      {
        code: "餐厅服务生女",
        name: "端庄姐",
        summary: "所谓端庄，就是端着盘子还能保持优雅。",
        copy: "笑着说您慢用，转身跑出残影，只有下班才能让她真正停下。"
      },
      {
        code: "图鉴ID 01",
        name: "原生松弛草",
        summary: "不加配饰自在生长，基础但绝不普通",
        copy: "不戴任何配饰自在生长，保持基础模样却从来不普通。",
        image: "./assets/native-grass.png"
      },
      {
        code: "图鉴ID 02",
        name: "红蝶草公主",
        summary: "红蝶结点亮青草，普通日子也精致",
        copy: "红蝶结点亮普通青草，平凡日子同样值得被认真装点。",
        image: "./assets/red-bow-grass.png"
      },
      {
        code: "图鉴ID 03",
        name: "冬帽草团子",
        summary: "红帽裹住青草，班味瞬间被治愈",
        copy: "红色暖帽裹住嫩青草，疲惫班味瞬间被自然气息治愈。",
        image: "./assets/winter-hat-grass.png"
      },
      {
        code: "图鉴ID 04",
        name: "心草恋爱脑",
        summary: "爱心镜守着草叶，风一吹就心动",
        copy: "爱心墨镜守着柔软草叶，只要清风一吹就会怦然心动。",
        image: "./assets/heart-grass.png"
      },
      {
        code: "图鉴ID 05",
        name: "草场嘻哈仔",
        summary: "绿帽压着青草，松弛感铺满草场",
        copy: "绿帽压着一丛鲜嫩青草，松弛感随着清风铺满整片草场。",
        image: "./assets/hiphop-grass.png"
      },
      {
        code: "图鉴ID 06",
        name: "蓝蝶萝卜妹",
        summary: "蓝蝶结配胡萝卜，甜妹能量满格",
        copy: "蓝蝶结搭配橙色胡萝卜，甜妹能量已经全部补充完毕。",
        image: "./assets/carrot-grass.png"
      },
      {
        code: "图鉴ID 07",
        name: "木桩发芽啦",
        summary: "枯木头顶冒新芽，活人感重新加载",
        copy: "枯木头顶重新冒出嫩芽，消失许久的活人感再次加载。",
        image: "./assets/sprout-stump.png"
      },
      {
        code: "图鉴ID 08",
        name: "不是棉羊哥",
        summary: "不是哥们，棉花怎么突然长出羊脸了！",
        copy: "瞪着两只无辜大眼，主打一个啥也没干却十分显眼。",
        image: "./assets/cotton-sheep.png"
      },
      {
        code: "图鉴ID 09",
        name: "粉镜毛线精",
        summary: "粉墨镜配绿边，显眼包属性拉满",
        copy: "粉色墨镜配上绿色边框，毛线显眼包水灵灵地闯进全场。",
        image: "./assets/pink-glasses-yarn.png"
      },
      {
        code: "图鉴ID 10",
        name: "黑镜麦霸总",
        summary: "黑镜一戴，整片麦田都被硬控",
        copy: "黑色墨镜一戴气场全开，整片麦田都被霸总魅力牢牢硬控。",
        image: "./assets/black-glasses-wheat.png"
      }
    ];

    const rows = document.querySelector("#rows");
    const empty = document.querySelector("#empty");
    const search = document.querySelector("#search");
    let selected = 0;

    function preview(index) {
      selected = index;
      const role = roles[index];
      document.querySelector("#preview-name").textContent = role.name;
      document.querySelector("#preview-code").textContent = role.code;
      document.querySelector("#preview-summary").textContent = role.summary;
      document.querySelector("#preview-copy").textContent = role.copy;
      document.querySelector("#preview-index").textContent = `${index + 1} / ${roles.length}`;
      const previewImage = document.querySelector("#preview-image");
      const placeholder = document.querySelector("#preview-placeholder");
      const shadow = document.querySelector("#preview-shadow");
      previewImage.hidden = !role.image;
      placeholder.hidden = Boolean(role.image);
      shadow.hidden = Boolean(role.image);
      if (role.image) {
        previewImage.src = role.image;
        previewImage.alt = `${role.name}角色形象`;
      } else {
        previewImage.removeAttribute("src");
        previewImage.alt = "";
      }
      document.querySelectorAll("tbody tr").forEach((row) => {
        row.classList.toggle("selected", Number(row.dataset.index) === selected);
      });
    }

    function render(filter = "") {
      const keyword = filter.trim().toLowerCase();
      const visible = roles
        .map((role, index) => ({ role, index }))
        .filter(({ role }) => Object.values(role).join(" ").toLowerCase().includes(keyword));

      rows.innerHTML = visible.map(({ role, index }) => `
        <tr data-index="${index}" tabindex="0" aria-label="预览${role.name}">
          <td><span class="code-label">${role.code}</span></td>
          <td class="col-image">${role.image
            ? `<img class="role-thumb" src="${role.image}" alt="${role.name}角色缩略图" loading="lazy">`
            : `<span class="role-thumb-empty" aria-label="${role.name}暂无角色图">待补图</span>`}
          </td>
          <td><span class="role-name">${role.name}</span></td>
          <td>${role.summary}</td>
          <td>${role.copy}</td>
          <td class="col-count"><span class="copy-count">${role.copy.length}${role.image ? "字" : "/27"}</span></td>
          <td class="col-action"><button class="preview-btn" type="button" data-preview="${index}">预览</button></td>
        </tr>
      `).join("");

      empty.hidden = visible.length !== 0;
      document.querySelectorAll("tbody tr").forEach((row) => {
        row.addEventListener("click", () => preview(Number(row.dataset.index)));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            preview(Number(row.dataset.index));
          }
        });
      });
      document.querySelectorAll("[data-preview]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          preview(Number(button.dataset.preview));
        });
      });
      preview(selected);
    }

    search.addEventListener("input", (event) => render(event.target.value));
    render();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="集中审阅砖块角色名字、一句话概述与27字图鉴文案，并实时查看游戏内详情效果。">
  <title>砖块角色文案预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/subpage-shell.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2421;
      --muted: #69706c;
      --line: #d8ddd9;
      --paper: #ffffff;
      --canvas: #eef1ed;
      --red: #ed3f39;
      --red-dark: #b82725;
      --green: #76ad37;
      --yellow: #f3c94f;
      --charcoal: #242725;
      --focus: #2670cc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button,
    input { font: inherit; }

    .copy-topbar {
      border-bottom: 4px solid var(--red);
      background: var(--charcoal);
      color: #fff;
    }

    .copy-topbar-inner {
      width: min(1480px, calc(100% - 40px));
      min-height: 86px;
      margin: 0 auto;
      padding-left: 154px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: #e7ebe8;
      font-size: 13px;
    }

    .summary span {
      padding: 5px 8px;
      border: 1px solid #626865;
      border-radius: 4px;
    }

    main {
      width: min(1480px, calc(100% - 40px));
      margin: 24px auto 40px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      align-items: start;
      gap: 20px;
    }

    .table-surface,
    .preview-surface {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 3px 12px rgb(28 35 31 / 8%);
    }

    .toolbar {
      min-height: 64px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar-title {
      min-width: 160px;
      font-size: 17px;
      font-weight: 750;
    }

    .toolbar-actions {
      width: min(360px, 50%);
      display: grid;
      gap: 5px;
    }

    .search {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #bcc4bf;
      border-radius: 6px;
      color: var(--ink);
      background: #fafbfa;
      outline: none;
    }

    .search:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgb(38 112 204 / 14%);
    }

    .upload-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .upload-status:empty { display: none; }

    .file-input {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 198px);
    }

    table {
      width: 100%;
      min-width: 1030px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th,
    td {
      padding: 14px 14px;
      border-bottom: 1px solid #e4e8e5;
      text-align: left;
      vertical-align: top;
      line-height: 1.65;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: #4f5752;
      background: #f4f6f4;
      font-size: 13px;
      font-weight: 700;
    }

    tbody tr {
      cursor: pointer;
      background: #fff;
      transition: background-color 140ms ease;
    }

    tbody tr:hover { background: #fbf8ee; }
    tbody tr.selected { background: #fff5f3; }
    tbody tr.selected td:first-child { box-shadow: inset 4px 0 0 var(--red); }
    tbody tr:last-child td { border-bottom: 0; }

    .col-code { width: 140px; }
    .col-image { width: 92px; padding-inline: 8px; text-align: center; }
    .col-name { width: 112px; }
    .col-summary { width: 270px; }
    .col-copy { width: auto; }
    .col-count { width: 72px; text-align: center; }
    .col-action { width: 72px; padding-inline: 6px; text-align: center; }

    .code-label {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid #c9d0cc;
      border-radius: 4px;
      color: #414844;
      background: #f7f8f7;
      font-size: 13px;
      white-space: nowrap;
    }

    .role-name {
      color: #c92f2c;
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .image-control {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .image-upload-btn {
      position: relative;
      display: block;
      width: 64px;
      height: 64px;
      padding: 0;
      overflow: hidden;
      border: 1px solid #cfd5d1;
      border-radius: 6px;
      background: #252825;
      cursor: pointer;
    }

    .image-upload-btn:hover,
    .image-upload-btn:focus-visible {
      border-color: var(--red);
      outline: 2px solid rgb(237 63 57 / 18%);
      outline-offset: 1px;
    }

    .role-thumb {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .image-action-label {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 2px 3px;
      color: #fff;
      background: rgb(18 20 18 / 78%);
      font-size: 11px;
      line-height: 1.35;
    }

    .restore-image-btn {
      padding: 1px 4px;
      border: 0;
      color: var(--red-dark);
      background: transparent;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
    }

    .restore-image-btn:hover,
    .restore-image-btn:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .copy-count {
      display: inline-flex;
      min-width: 42px;
      height: 26px;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: #255d2c;
      background: #e7f3e5;
      font-size: 12px;
      font-weight: 750;
    }

    .preview-btn {
      display: inline-flex;
      width: max-content;
      min-width: 0;
      height: 30px;
      padding: 0 7px;
      align-items: center;
      justify-content: center;
      border: 1px solid #bbb;
      border-radius: 5px;
      color: #333;
      background: #fff;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .preview-btn:hover,
    .preview-btn:focus-visible {
      border-color: var(--red);
      color: var(--red-dark);
      outline: none;
    }

    .preview-surface {
      position: sticky;
      top: 20px;
      color: #fff;
      background: #1f211f;
    }

    .preview-heading {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #3a3e3b;
      font-size: 15px;
      font-weight: 750;
    }

    .preview-index {
      color: #bfc5c1;
      font-size: 12px;
      font-weight: 500;
    }

    .stage {
      position: relative;
      min-height: 630px;
      padding: 70px 24px 28px;
      overflow: hidden;
      background-color: #252825;
      background-image:
        linear-gradient(90deg, transparent 49%, rgb(255 255 255 / 3%) 50%, transparent 51%),
        linear-gradient(0deg, transparent 49%, rgb(255 255 255 / 3%) 50%, transparent 51%);
      background-size: 28px 28px;
    }

    .spotlight {
      position: absolute;
      top: 0;
      left: 50%;
      width: 260px;
      height: 430px;
      transform: translateX(-50%);
      clip-path: polygon(39% 0, 61% 0, 100% 100%, 0 100%);
      background: rgb(255 252 220 / 22%);
      pointer-events: none;
    }

    .ribbon {
      position: relative;
      z-index: 1;
      width: fit-content;
      min-width: 176px;
      max-width: 240px;
      margin: 0 auto;
      padding: 10px 22px;
      color: #fff;
      border: 2px solid #ff625c;
      background: var(--red);
      box-shadow: 0 8px 0 var(--red-dark);
      text-align: center;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 900;
      white-space: nowrap;
    }

    .character-slot {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 240px;
      margin: 28px auto 16px;
      display: grid;
      place-items: center;
    }

    .character {
      position: relative;
      width: 154px;
      height: 176px;
    }

    .character-image {
      display: block;
      width: min(280px, 100%);
      height: 240px;
      border-radius: 6px;
      object-fit: contain;
    }

    .character-image[hidden],
    .character[hidden] {
      display: none;
    }

    .tile {
      position: absolute;
      top: 0;
      left: 8px;
      width: 138px;
      height: 132px;
      overflow: hidden;
      border: 6px solid #111;
      border-radius: 10px;
      background: #e9f8a7;
      box-shadow: inset 14px 0 0 #91bc41, inset -8px -8px 0 rgb(93 131 49 / 20%);
    }

    .leaf {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 32px;
      height: 70px;
      border: 5px solid #396e10;
      border-radius: 70% 10% 65% 15%;
      background: #7bc51e;
      transform-origin: bottom center;
    }

    .leaf.a { transform: translateX(-50%) rotate(-35deg); }
    .leaf.b { transform: translateX(-50%) rotate(0deg); height: 82px; }
    .leaf.c { transform: translateX(-50%) rotate(35deg); }

    .foot {
      position: absolute;
      top: 126px;
      width: 34px;
      height: 47px;
      border-left: 5px solid #111;
      border-bottom: 9px solid #111;
      border-radius: 0 0 0 26px;
    }

    .foot.left { left: 42px; }
    .foot.right { right: 37px; }

    .shadow {
      position: absolute;
      z-index: 0;
      top: 354px;
      left: 50%;
      width: 205px;
      height: 32px;
      border-radius: 50%;
      background: rgb(255 255 255 / 72%);
      box-shadow: 0 0 28px rgb(255 250 210 / 48%);
      transform: translateX(-50%);
    }

    .copy-box {
      position: relative;
      z-index: 1;
      min-height: 166px;
      margin-top: 12px;
      padding: 18px 20px;
      border: 4px solid #111;
      border-radius: 8px;
      color: #1f211f;
      background: #f4f4f1;
    }

    .copy-kicker {
      margin-bottom: 8px;
      color: #727873;
      font-size: 12px;
      font-weight: 700;
    }

    .preview-summary {
      margin: 0 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #cfd4d0;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 650;
    }

    .preview-copy {
      margin: 0;
      font-size: 16px;
      line-height: 1.75;
      font-weight: 700;
    }

    .empty {
      padding: 56px 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; }
      .preview-surface { position: static; }
      .stage { min-height: 570px; }
      .table-wrap { max-height: none; }
    }

    @media (max-width: 680px) {
      .copy-topbar-inner,
      main { width: min(100% - 24px, 1480px); }
      .copy-topbar-inner { padding: 72px 0 16px; align-items: flex-start; flex-direction: column; }
      h1 { font-size: 23px; }
      .summary { justify-content: flex-start; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-actions { width: 100%; }
      .stage { padding-inline: 16px; }
    }
  </style>
</head>

        copy: "粉色镜框镇住混乱，纠缠半天反而织出了高级感。",
        image: "./assets/pink-glasses-yarn.png"
      },
      {
        code: "图鉴ID 10",
        name: "黑镜麦霸总",
        summary: "墨镜一戴气场全开，麦穗也当霸总",
        copy: "别的庄稼迎风弯腰，他扶了扶墨镜，静候秋天亲自递上分红。",
        image: "./assets/black-glasses-wheat.png"
      }
    ];

      const rows = document.querySelector("#rows");
      const empty = document.querySelector("#empty");
      const search = document.querySelector("#search");
      const imageInput = document.querySelector("#role-image-input");
      const uploadStatus = document.querySelector("#upload-status");
      const imageObjectUrls = new Map();
      const databaseName = "brick-character-copy-preview-v1";
      const imageStoreName = "image-overrides";
      const allowedImageTypes = new Set(["image/png", "image/jpeg", "image/webp"]);
      const maxImageBytes = 8 * 1024 * 1024;
      let selected = 0;
      let uploadTarget = null;
      let databasePromise = null;

      function announce(message) {
        uploadStatus.textContent = message;
      }

      function openImageDatabase() {
        if (!window.indexedDB) return Promise.reject(new Error("当前浏览器不支持本地图片保存。"));
        if (databasePromise) return databasePromise;
        databasePromise = new Promise((resolve, reject) => {
          const request = window.indexedDB.open(databaseName, 1);
          request.addEventListener("upgradeneeded", () => {
            if (!request.result.objectStoreNames.contains(imageStoreName)) {
              request.result.createObjectStore(imageStoreName, { keyPath: "roleCode" });
            }
          });
          request.addEventListener("success", () => resolve(request.result));
          request.addEventListener("error", () => reject(request.error || new Error("无法打开本地图片库。")));
          request.addEventListener("blocked", () => reject(new Error("本地图片库正在被其他页面占用。")));
        });
        return databasePromise;
      }

      async function getImageOverrides() {
        const database = await openImageDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(imageStoreName, "readonly");
          const request = transaction.objectStore(imageStoreName).getAll();
          request.addEventListener("success", () => {
            resolve(new Map(request.result.map((record) => [record.roleCode, record.blob])));
          });
          request.addEventListener("error", () => reject(request.error || new Error("无法读取本地图片。")));
        });
      }

      async function saveImageOverride(roleCode, blob) {
        const database = await openImageDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(imageStoreName, "readwrite");
          transaction.objectStore(imageStoreName).put({ roleCode, blob, updatedAt: Date.now() });
          transaction.addEventListener("complete", resolve);
          transaction.addEventListener("error", () => reject(transaction.error || new Error("无法保存本地图片。")));
          transaction.addEventListener("abort", () => reject(transaction.error || new Error("本地图片保存已中止。")));
        });
      }

      async function deleteImageOverride(roleCode) {
        const database = await openImageDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(imageStoreName, "readwrite");
          transaction.objectStore(imageStoreName).delete(roleCode);
          transaction.addEventListener("complete", resolve);
          transaction.addEventListener("error", () => reject(transaction.error || new Error("无法删除本地图片。")));
          transaction.addEventListener("abort", () => reject(transaction.error || new Error("本地图片恢复已中止。")));
        });
      }

      function setObjectUrl(role, blob) {
        const previousUrl = imageObjectUrls.get(role.code);
        if (previousUrl) URL.revokeObjectURL(previousUrl);
        const objectUrl = URL.createObjectURL(blob);
        imageObjectUrls.set(role.code, objectUrl);
        role.overrideImage = objectUrl;
        role.hasImageOverride = true;
      }

      function clearObjectUrl(role) {
        const previousUrl = imageObjectUrls.get(role.code);
        if (previousUrl) URL.revokeObjectURL(previousUrl);
        imageObjectUrls.delete(role.code);
        delete role.overrideImage;
        delete role.hasImageOverride;
      }

      function displayedImage(role) {
        return role.overrideImage || role.image;
      }

      async function prepareImage(file) {
        if (!allowedImageTypes.has(file.type)) {
          throw new Error("仅支持 PNG、JPG 和 WebP 图片。 ");
        }
        if (file.size > maxImageBytes) {
          throw new Error("图片不能超过 8 MB。 ");
        }

        let bitmap;
        try {
          bitmap = await createImageBitmap(file);
        } catch {
          throw new Error("图片文件无法读取，请换一张图片重试。 ");
        }

        try {
          const scale = Math.min(1, 1024 / Math.max(bitmap.width, bitmap.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(bitmap.width * scale));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale));
          const context = canvas.getContext("2d");
          if (!context) throw new Error("当前浏览器无法处理图片。 ");
          context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/webp", 0.9));
          if (!blob) throw new Error("图片处理失败，请换一张图片重试。 ");
          return blob;
        } finally {
          bitmap.close?.();
        }
      }

      async function setRoleImageOverride(index, blob) {
        const role = roles[index];
        setObjectUrl(role, blob);
        let persisted = true;
        try {
          await saveImageOverride(role.code, blob);
        } catch {
          persisted = false;
        }
        selected = index;
        render(search.value);
        preview(index);
        announce(persisted
          ? `${role.name}图片已保存到当前浏览器。`
          : "图片已用于本次预览，但当前浏览器无法在刷新后保留。");
      }

      async function restoreRoleImage(index) {
        const role = roles[index];
        try {
          await deleteImageOverride(role.code);
        } catch {
          // Session-only overrides can still be restored when persistent storage is unavailable.
        }
        clearObjectUrl(role);
        selected = index;
        render(search.value);
        preview(index);
        announce(`${role.name}已恢复原图。`);
      }

      async function hydrateImageOverrides() {
        try {
          const overrides = await getImageOverrides();
          roles.forEach((role) => {
            const blob = overrides.get(role.code);
            if (blob) setObjectUrl(role, blob);
          });
        } catch {
          // Bundled images remain fully usable when IndexedDB is unavailable.
        }
      }

    function preview(index) {
      selected = index;
      const role = roles[index];
      document.querySelector("#preview-name").textContent = role.name;
      document.querySelector("#preview-code").textContent = role.code;
      document.querySelector("#preview-summary").textContent = role.summary;
      document.querySelector("#preview-copy").textContent = role.copy;
      document.querySelector("#preview-index").textContent = `${index + 1} / ${roles.length}`;
      const previewImage = document.querySelector("#preview-image");
      const placeholder = document.querySelector("#preview-placeholder");
      const shadow = document.querySelector("#preview-shadow");
        const image = displayedImage(role);
        previewImage.hidden = !image;
        placeholder.hidden = Boolean(image);
        shadow.hidden = Boolean(image);
        if (image) {
          previewImage.src = image;
        previewImage.alt = `${role.name}角色形象`;
      } else {
        previewImage.removeAttribute("src");
        previewImage.alt = "";
      }
      document.querySelectorAll("tbody tr").forEach((row) => {
        row.classList.toggle("selected", Number(row.dataset.index) === selected);
      });
    }

    function render(filter = "") {
      const keyword = filter.trim().toLowerCase();
      const visible = roles
        .map((role, index) => ({ role, index }))
        .filter(({ role }) => Object.values(role).join(" ").toLowerCase().includes(keyword));

        rows.innerHTML = visible.map(({ role, index }) => `
          <tr data-index="${index}" tabindex="0" aria-label="预览${role.name}">
            <td><span class="code-label">${role.code}</span></td>
            <td class="col-image">
              <div class="image-control">
                <button class="image-upload-btn" type="button" data-upload-index="${index}" aria-label="上传或替换${role.name}图片" title="上传或替换${role.name}图片">
                  <img class="role-thumb" src="${displayedImage(role)}" alt="${role.name}角色缩略图" loading="lazy">
                  <span class="image-action-label">替换</span>
                </button>
                ${role.hasImageOverride ? `<button class="restore-image-btn" type="button" data-restore-index="${index}">恢复原图</button>` : ""}
              </div>
            </td>
            <td><span class="role-name">${role.name}</span></td>
            <td>${role.summary}</td>
            <td>${role.copy}</td>
            <td class="col-count"><span class="copy-count">${index < 10 ? `${role.copy.length}/27` : `${role.copy.length}字`}</span></td>
            <td class="col-action"><button class="preview-btn" type="button" data-preview="${index}">预览</button></td>
          </tr>
      `).join("");

      empty.hidden = visible.length !== 0;
      document.querySelectorAll("tbody tr").forEach((row) => {
        row.addEventListener("click", () => preview(Number(row.dataset.index)));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            preview(Number(row.dataset.index));
          }
        });
      });
        document.querySelectorAll("[data-preview]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          preview(Number(button.dataset.preview));
          });
        });
        document.querySelectorAll("[data-upload-index]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            uploadTarget = Number(button.dataset.uploadIndex);
            preview(uploadTarget);
            imageInput.value = "";
            imageInput.click();
          });
        });
        document.querySelectorAll("[data-restore-index]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            restoreRoleImage(Number(button.dataset.restoreIndex));
          });
        });
        preview(selected);
      }

      search.addEventListener("input", (event) => render(event.target.value));
      imageInput.addEventListener("change", async () => {
        const index = uploadTarget;
        const file = imageInput.files?.[0];
        uploadTarget = null;
        imageInput.value = "";
        if (index === null || !file) return;
        try {
          announce("正在处理图片…");
          const blob = await prepareImage(file);
          await setRoleImageOverride(index, blob);
        } catch (error) {
          announce(error instanceof Error ? error.message.trim() : "图片处理失败，请重试。");
        }
      });
      hydrateImageOverrides().finally(() => render());
  </script>
</body>
</html>

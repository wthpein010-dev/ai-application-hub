<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:,">
    <title>砖块小人图鉴与文案校对介绍视频</title>
    <link rel="stylesheet" href="../../../assets/hub-video-player.css">
  </head>
  <body data-hub-video-page>
    <a class="hub-video-home" href="../../../index.html#engineering">返回主页</a>
    <main class="hub-video-page">
      <p class="hub-video-kicker">功能演示</p>
      <h1>砖块小人图鉴 · 45 个正式角色与真实换行诊断</h1>
      <p class="hub-video-description">同步 Unity 正式配置，默认全解锁；点击角色打开游戏式详情，检查名字、获取文案和图鉴描述的真实换行，并可直达随身小物交易市场。</p>
      <section class="hub-video-player" aria-label="砖块小人图鉴与文案校对介绍视频">
        <div class="hub-video-stage">
          <div class="hub-video-load-card" id="loadCard" role="status">
            <strong>准备播放功能演示</strong>
            <p data-hub-video-message>点击后再加载视频，避免打开页面时等待。</p>
            <button id="loadVideo" type="button">加载并播放视频</button>
          </div>
          <video id="introVideo" controls playsinline preload="none" data-src="./brick-character-copy-preview-demo.mp4" poster="./poster.jpg" hidden>
            <track kind="captions" src="./brick-character-copy-preview-demo.vtt" srclang="zh" label="中文字幕" default>
          </video>
        </div>
      </section>
      <nav class="hub-video-actions" aria-label="视频相关入口">
        <a href="./brick-character-copy-preview-demo.mp4">打开 MP4</a>
        <a href="../index.html">打开图鉴</a>
      </nav>
      <section class="hub-video-chapters" aria-label="视频章节">
        <button class="hub-video-chapter" type="button" data-time="0"><time>00:00</time><span>45 角色默认全解锁</span></button>
        <button class="hub-video-chapter" type="button" data-time="7"><time>00:07</time><span>游戏式角色详情</span></button>
        <button class="hub-video-chapter" type="button" data-time="15"><time>00:15</time><span>换角、收藏与诊断</span></button>
        <button class="hub-video-chapter" type="button" data-time="23"><time>00:23</time><span>分页搜索与文案校对</span></button>
        <button class="hub-video-chapter" type="button" data-time="32"><time>00:32</time><span>旧版表格与小物市场</span></button>
      </section>
    </main>
    <script type="module" src="../../../assets/hub-video-player.js"></script>
  </body>
</html>

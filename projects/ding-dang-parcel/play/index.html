<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fae3bf">
<title>叮当打包铺 · 手机触控版</title>
<style>
:root{--parcel-safe-top:env(safe-area-inset-top,0px);--parcel-safe-right:env(safe-area-inset-right,0px);--parcel-safe-bottom:env(safe-area-inset-bottom,0px);--parcel-safe-left:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fae3bf;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
#viewport{position:absolute;inset:var(--parcel-safe-top) var(--parcel-safe-right) var(--parcel-safe-bottom) var(--parcel-safe-left);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:20px system-ui;color:#453544;padding:24px}
progress{width:240px;max-width:100%;margin:20px auto;accent-color:#ec9464}
#state{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<div id="viewport">
<canvas id="game" tabindex="0" aria-label="叮当打包铺。单指拖动小物到纸盒，点按旋转、撤销、重开和提示。无需键盘。"></canvas>
<div id="loading"><h1>叮当打包铺</h1><p>正在准备纸盒和可爱小物…</p><progress value="0" max="1"></progress><small>手机竖屏 · 单指打包</small></div>
</div>
<div id="state" aria-live="polite"></div>
<script src="Build/WebGL.loader.js?v=1.1.0"></script>
<script>
const canvas=document.querySelector('canvas'),frame=document.querySelector('#viewport');
window.parcelVersion="1.1.0";
window.parcelDesign={width:720,height:1280};
function cancelPointer(reason){window.parcelInstance?.SendMessage("叮当打包铺","ParcelCancelPointer",reason)}
const renderRatio=Math.min(devicePixelRatio||1,2);let lastSize='';
function resize(){const rect=frame.getBoundingClientRect(),size=Math.round(rect.width)+','+Math.round(rect.height);if(lastSize!==size){cancelPointer('resize');lastSize=size;canvas.width=Math.max(1,Math.round(rect.width*renderRatio));canvas.height=Math.max(1,Math.round(rect.height*renderRatio))}}
resize();
new ResizeObserver(resize).observe(frame);
addEventListener('resize',resize);
window.visualViewport?.addEventListener('resize',resize);
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointercancel',()=>cancelPointer('pointercancel'));
canvas.addEventListener('touchcancel',()=>cancelPointer('touchcancel'));
addEventListener('pointerup',e=>{if(e.target!==canvas)cancelPointer('outside-release')});
addEventListener('blur',()=>cancelPointer('blur'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelPointer('hidden')});
createUnityInstance(canvas,{
 dataUrl:"Build/WebGL.data?v=1.1.0",
 frameworkUrl:"Build/WebGL.framework.js?v=1.1.0",
 codeUrl:"Build/WebGL.wasm?v=1.1.0",
 streamingAssetsUrl:"StreamingAssets",
 companyName:"Original Parcel",productName:"叮当打包铺",productVersion:"1.1.0",
 devicePixelRatio:renderRatio
},p=>document.querySelector('progress').value=p).then(u=>{
 window.parcelInstance=u;document.querySelector('#loading').remove();canvas.focus({preventScroll:true});resize()
}).catch(e=>{document.querySelector('#loading').textContent="加载未完成，请刷新重试："+e});
</script>
</body>
</html>

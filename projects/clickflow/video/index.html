<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>ClickFlow 快速上手教学</title>
    <link rel="stylesheet" href="../../../assets/hub-video-player.css" />
  </head>
  <body data-hub-video-page>
    <a class="hub-video-home" href="../../../index.html#apps">返回主页</a>
    <main class="hub-video-page">
      <p class="hub-video-kicker">CLICKFLOW 2.0 · 教学视频</p>
      <h1>从定点点击到录制回放</h1>
      <p class="hub-video-description">
        50 秒了解坐标、间隔、光标恢复、录制、回放和快捷键。视频由程序化界面场景生成，没有操作真实系统鼠标。
      </p>
      <section class="hub-video-player" aria-label="ClickFlow 快速上手教学视频">
        <div class="hub-video-stage">
          <div class="hub-video-load-card" id="loadCard" role="status">
            <strong>准备播放 ClickFlow 教学</strong>
            <p data-hub-video-message>点击后再加载视频，避免打开页面时等待。</p>
            <button id="loadVideo" type="button">加载并播放视频</button>
          </div>
          <video id="introVideo" controls playsinline preload="none" data-src="./clickflow-demo.mp4" poster="./poster.jpg" hidden><track kind="captions" src="./clickflow-demo.vtt" srclang="zh-CN" label="简体中文" default /></video>
        </div>
      </section>
      <nav class="hub-video-actions" aria-label="视频相关入口">
        <a href="./clickflow-demo.mp4">打开 MP4</a>
        <a href="../index.html">打开交互演示</a>
      </nav>
      <section class="hub-video-chapters" aria-label="视频章节">
        <button class="hub-video-chapter" type="button" data-time="0"><time>00:00</time><span>填写坐标与间隔</span></button>
        <button class="hub-video-chapter" type="button" data-time="10"><time>00:10</time><span>恢复光标并启动</span></button>
        <button class="hub-video-chapter" type="button" data-time="20"><time>00:20</time><span>使用 F6 录制</span></button>
        <button class="hub-video-chapter" type="button" data-time="30"><time>00:30</time><span>编辑与循环回放</span></button>
        <button class="hub-video-chapter" type="button" data-time="40"><time>00:40</time><span>F9 停止与下载</span></button>
      </section>
    </main>
    <script type="module" src="../../../assets/hub-video-player.js"></script>
  </body>
</html>

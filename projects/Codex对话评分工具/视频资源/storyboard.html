<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Reviewer Video Frames</title>
  <style>
    :root{--bg:#07111f;--side:#0b1728;--panel:#112038;--panel2:#172a47;--line:#294566;--text:#f6f9ff;--muted:#a7b8cf;--blue:#73a7ff;--green:#55d7a7;--orange:#ffb45c;--red:#ff7d8d}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","Segoe UI",sans-serif}.frame{display:grid;grid-template-columns:310px 1fr;width:1920px;height:1080px;background:radial-gradient(circle at 88% 0,#153761 0,transparent 39%),var(--bg)}aside{padding:44px 28px;background:#081523e8;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:15px;font-size:24px;font-weight:900}.logo{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--blue),#826dff);color:#07111f}.sub{margin:8px 0 44px 69px;color:var(--muted);font-size:14px}.nav{display:grid;gap:12px}.nav div{padding:15px 17px;border:1px solid transparent;border-radius:11px;color:var(--muted);font-size:17px}.nav .active{border-color:var(--line);background:var(--panel);color:var(--text)}.privacy{position:absolute;left:28px;bottom:38px;width:250px;padding:16px;border:1px solid #2f745f;border-radius:12px;background:#102c2a;color:#bcefdc;font-size:14px;line-height:1.6}main{padding:48px 58px 40px;min-width:0}.kicker{color:var(--green);font-size:15px;font-weight:900;letter-spacing:.15em}.title{margin:10px 0 8px;font-size:46px;line-height:1.15}.lead{margin:0 0 28px;color:var(--muted);font-size:19px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{border:1px solid var(--line);border-radius:16px;background:#101f35e8;padding:24px;box-shadow:0 18px 50px #0003}.card h2{margin:0 0 15px;font-size:20px}.metric{grid-column:span 3}.metric strong{display:block;font-size:45px;margin:9px 0 3px}.metric span,.muted{color:var(--muted)}.wide{grid-column:span 8}.narrow{grid-column:span 4}.full{grid-column:1/-1}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#1e3d65;color:#cfe0ff;font-size:13px;font-weight:800}.pill.green{background:#153f36;color:#baf0dc}.pill.orange{background:#4a3520;color:#ffe0b3}.score{font-weight:900}.score.good{color:var(--green)}.score.mid{color:var(--orange)}.score.bad{color:var(--red)}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:15px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:#cfe0f5;background:#162943}td{color:#dfe8f5}.bar{height:10px;border-radius:8px;background:#203652;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:8px}.terminal{padding:24px 28px;border:1px solid #38516e;border-radius:14px;background:#050c15;font:18px/1.8 Consolas,monospace;color:#d7e4f6;box-shadow:inset 0 1px #ffffff0d}.termhead{display:flex;gap:8px;margin-bottom:17px}.dot{width:12px;height:12px;border-radius:50%;background:#ff6b6b}.dot:nth-child(2){background:#ffd066}.dot:nth-child(3){background:#55d7a7}.prompt{color:var(--green)}.mask{color:var(--orange)}.ok{color:#69e2b7}.tabs{display:flex;gap:7px;margin:-5px 0 20px}.tab{padding:11px 18px;border:1px solid var(--line);border-radius:9px 9px 0 0;color:var(--muted);background:#0b1728}.tab.active{color:#07111f;background:var(--green);border-color:var(--green);font-weight:900}.rewrite{display:grid;grid-template-columns:1fr 1fr;gap:18px}.quote{min-height:250px;padding:22px;border:1px solid var(--line);border-radius:13px;background:#0c192b;font-size:19px;line-height:1.7}.quote.good{border-color:#327b64;background:#102923}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.check{padding:15px;border:1px solid var(--line);border-radius:10px;background:#132640}.check b{color:var(--green)}.cta{display:flex;align-items:center;justify-content:space-between;padding:25px 28px;border-radius:15px;background:linear-gradient(100deg,#315f9f,#225f55)}.cta strong{font-size:28px}.button{padding:14px 24px;border-radius:10px;background:white;color:#0a1a2b;font-weight:900}.chart{display:flex;align-items:end;gap:18px;height:180px;padding-top:20px}.col{flex:1;text-align:center;color:var(--muted)}.col i{display:block;width:100%;margin-bottom:8px;border-radius:8px 8px 2px 2px;background:linear-gradient(#78abff,#3e6da9)}.legend{display:flex;gap:18px;color:var(--muted);font-size:14px}.legend b{color:var(--text)}
  </style>
</head>
<body><div id="app"></div>
<script>
const views={
problem:`<span class="kicker">对话质量复盘</span><h1 class="title">长对话里的问题，不该靠感觉寻找</h1><p class="lead">把分散在需求、修改和验证中的提示记录，整理成可量化、可筛选的报告。</p><div class="grid"><section class="card metric"><span class="pill">用户提示</span><strong>128</strong><span>来自 12 个任务</span></section><section class="card metric"><span class="pill green">平均分</span><strong class="score mid">7.4</strong><span>仍有提升空间</span></section><section class="card metric"><span class="pill orange">需复盘</span><strong class="score bad">23</strong><span>低于 6 分</span></section><section class="card metric"><span class="pill">高质量</span><strong class="score good">61%</strong><span>目标明确可验收</span></section><section class="card wide"><h2>最近会话</h2><table><tr><th>任务</th><th>提示数</th><th>平均分</th><th>主要问题</th></tr><tr><td>星球收纳师 · UI 初版</td><td>18</td><td class="score good">8.6</td><td>验收条件完整</td></tr><tr><td>登录流程优化</td><td>14</td><td class="score mid">6.8</td><td>缺少异常路径</td></tr><tr><td>资源整理脚本</td><td>21</td><td class="score bad">5.7</td><td>操作边界不明确</td></tr></table></section><section class="card narrow"><h2>评分维度</h2><p>清晰度</p><div class="bar"><i style="width:84%"></i></div><p>上下文完整度</p><div class="bar"><i style="width:68%"></i></div><p>可执行性</p><div class="bar"><i style="width:77%"></i></div></section></div>`,
launch:`<span class="kicker">第一步 · 启动</span><h1 class="title">双击运行，自动寻找 Codex 会话</h1><p class="lead">Windows 使用发布包；macOS 和 Linux 可以运行 Python 源码并指定扫描路径。</p><div class="grid"><section class="card wide"><h2>Windows 发布包</h2><div class="terminal"><div class="termhead"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><span class="prompt">&gt; run_codex_review.bat</span><br>Codex Conversation Reviewer 1.0<br>正在检查本地数据目录……<br><span class="ok">已定位会话目录：C:/Users/Demo/.codex/sessions</span><br>正在读取会话索引…… 12 / 12<br><span class="ok">准备生成评分报告</span></div></section><section class="card narrow"><span class="pill green">无需 Python</span><h2 style="font-size:28px;margin-top:20px">Windows 直接运行</h2><p class="lead" style="font-size:17px">发布包已包含运行环境，输出会保存到 outputs 文件夹。</p><span class="pill">Mac / Linux</span><p style="font:17px/1.7 Consolas;color:#d5e3f7">python3 ./codex_conversation_reviewer.py</p></section><section class="card full"><div class="cta"><div><strong>也支持手动指定位置</strong><div class="muted">--codex-home · --scan-root · --output</div></div><span class="button">开始扫描</span></div></section></div>`,
redaction:`<span class="kicker">本地读取 · 默认脱敏</span><h1 class="title">先保护内容，再写入报告</h1><p class="lead">工具只读取本地会话文件，并在导出前隐藏明显的密钥、令牌和密码字段。</p><div class="grid"><section class="card full"><div class="terminal"><div class="termhead"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><span class="prompt">[SCAN]</span> sessions/2026/07/12/demo-thread.jsonl<br><span class="ok">[OK]</span> 读取 42 条消息，提取 18 条用户提示<br><span class="prompt">[REDACT]</span> api_key = <span class="mask">sk-***</span><br><span class="prompt">[REDACT]</span> access_token = <span class="mask">token_***</span><br><span class="prompt">[REDACT]</span> password = <span class="mask">[已隐藏]</span><br><span class="ok">[SAFE]</span> 未读取 auth.json；未上传任何会话内容<br><span class="ok">[DONE]</span> 已生成脱敏数据集</div></section><section class="card metric"><strong class="score good">100%</strong><span>本地处理</span></section><section class="card metric"><strong class="score good">3 类</strong><span>敏感字段隐藏</span></section><section class="card metric"><strong>0</strong><span>网络上传</span></section><section class="card metric"><strong>0</strong><span>真实演示数据</span></section></div>`,
scoring:`<span class="kicker">逐条评分</span><h1 class="title">不只给分，还告诉你下一句怎样说</h1><p class="lead">评分覆盖清晰度、上下文完整度、可执行性与风险控制，并为低分提示生成可直接使用的改写建议。</p><section class="card"><table><tr><th style="width:34%">用户提示</th><th>清晰度</th><th>上下文</th><th>可执行</th><th>风险</th><th>总分</th><th style="width:22%">反馈</th></tr><tr><td>“把页面改好看一点。”</td><td class="score bad">4</td><td class="score bad">3</td><td class="score bad">4</td><td class="score mid">7</td><td class="score bad">4.5</td><td>缺少目标风格、问题位置和验收标准。</td></tr><tr><td>“保持现有结构，将卡片对比度提升到 WCAG AA；移动端 390px 不横向溢出。先只修改 CSS。”</td><td class="score good">9</td><td class="score good">9</td><td class="score good">10</td><td class="score good">9</td><td class="score good">9.3</td><td>范围、约束与验收条件明确。</td></tr><tr><td>“删除旧文件并发布。”</td><td class="score mid">6</td><td class="score bad">4</td><td class="score mid">6</td><td class="score bad">2</td><td class="score bad">4.5</td><td>高风险操作缺少目标清单和确认步骤。</td></tr></table><div class="checks"><div class="check"><b>✓ 清晰度</b><br><span class="muted">目标是否具体</span></div><div class="check"><b>✓ 上下文完整度</b><br><span class="muted">背景和约束是否齐全</span></div><div class="check"><b>✓ 可执行性</b><br><span class="muted">结果能否验证</span></div><div class="check"><b>✓ 风险控制</b><br><span class="muted">危险动作是否有边界</span></div></div></section>`,
workbook:`<span class="kicker">Excel 结果</span><h1 class="title">四个工作表，从总览追到原始提示</h1><p class="lead">结果可以筛选、汇总和分享，既适合个人复盘，也方便整理团队协作规范。</p><div class="tabs"><span class="tab active">总览</span><span class="tab">逐条评分</span><span class="tab">会话汇总</span><span class="tab">评分规则</span></div><div class="grid"><section class="card metric"><span>提示总数</span><strong>128</strong></section><section class="card metric"><span>平均得分</span><strong class="score mid">7.4</strong></section><section class="card metric"><span>优秀提示</span><strong class="score good">78</strong></section><section class="card metric"><span>待复盘</span><strong class="score bad">23</strong></section><section class="card wide"><h2>等级分布</h2><div class="chart"><div class="col"><i style="height:42px"></i>D<br><b>8</b></div><div class="col"><i style="height:78px"></i>C<br><b>15</b></div><div class="col"><i style="height:132px"></i>B<br><b>27</b></div><div class="col"><i style="height:170px;background:linear-gradient(#63dfb2,#2e886b)"></i>A<br><b>78</b></div></div></section><section class="card narrow"><h2>主要问题</h2><p><span class="pill orange">31%</span> 缺少验收标准</p><p><span class="pill orange">24%</span> 上下文不完整</p><p><span class="pill orange">18%</span> 操作边界模糊</p><p><span class="pill green">建议</span> 优先沉淀改写模板</p></section></div>`,
review:`<span class="kicker">从分数到行动</span><h1 class="title">把低分提示，改成团队可复用的表达</h1><p class="lead">先找反复缺失的信息，再把有效写法沉淀成下一次可以直接套用的模板。</p><div class="rewrite"><section class="card"><span class="pill orange">原始提示 · 4.5 分</span><h2 style="font-size:27px;margin-top:18px">“把这个工具优化一下，然后发布。”</h2><div class="quote">问题：目标不具体；未说明允许修改的范围；缺少桌面和移动端验收标准；“发布”属于外部变更，但没有确认方式。</div></section><section class="card"><span class="pill green">建议改写 · 9.2 分</span><h2 style="font-size:27px;margin-top:18px">明确目标、范围和验收</h2><div class="quote good">“优化 Codex 对话评分工具的视频页：保持现有深色风格，增加中文配音演示，时长不超过三分钟。桌面与 390×844 视口不得横向溢出。完成本地测试后创建 PR，确认可合并再发布。”</div></section></div><div class="cta" style="margin-top:20px"><div><strong>Codex 对话评分工具</strong><div>本地扫描 · 默认脱敏 · Excel 复盘</div></div><span class="button">返回应用集合下载</span></div>`};
const key=new URLSearchParams(location.search).get('frame')||'problem';
document.querySelector('#app').innerHTML=`<div class="frame"><aside><div class="brand"><span class="logo">C</span><span>Codex Review</span></div><div class="sub">Conversation Quality</div><div class="nav"><div class="${key==='problem'?'active':''}">01 总览</div><div class="${key==='launch'?'active':''}">02 启动与扫描</div><div class="${key==='redaction'?'active':''}">03 隐私脱敏</div><div class="${key==='scoring'?'active':''}">04 逐条评分</div><div class="${key==='workbook'?'active':''}">05 Excel 报告</div><div class="${key==='review'?'active':''}">06 复盘改写</div></div><div class="privacy">✓ 演示数据已脱敏<br>✓ 不包含真实用户路径<br>✓ 不展示任何有效密钥</div></aside><main>${views[key]||views.problem}</main></div>`;
</script></body></html>

><li data-step="reward">获得新装</li></ol><p>奖励按日期开放<br>月饼余额跨天保留<br>自主选择 · 兑换扣费</p></section></main><script src="gameplay.js"></script><script src="results.js?v=40"></script><script src="balance-motion.js?v=40"></script><script src="app.js?v=40"></script></body></html>

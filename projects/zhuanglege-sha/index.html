<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="&#35013;&#20102;&#20010;&#21861; Unity WebGL &#20307;&#39564;&#20837;&#21475;&#65292;&#28857;&#20987;&#21518;&#21152;&#36733;&#32593;&#39029;&#36164;&#28304;&#12290;" />
    <title>&#35013;&#20102;&#20010;&#21861; | Unity WebGL</title>
    <link rel="shortcut icon" href="./TemplateData/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #10141a;
        --paper: #fff4d7;
        --ink: #251706;
        --muted: #745d47;
        --green: #80e55f;
        --blue: #55b6ff;
        --line: rgba(255, 255, 255, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        color: #fffaf1;
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        background:
          radial-gradient(circle at 74% 18%, rgba(128, 229, 95, 0.32), transparent 30%),
          radial-gradient(circle at 20% 12%, rgba(255, 208, 120, 0.28), transparent 30%),
          linear-gradient(135deg, #543a25 0%, #9a7650 44%, #566d44 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 58px 58px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.82), transparent 82%);
      }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 22px 0 32px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 48px;
      }

      .topbar a,
      .topbar span {
        color: rgba(255, 250, 241, 0.86);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .topbar a {
        color: #fffaf1;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(320px, 390px);
        gap: clamp(28px, 5vw, 62px);
        align-items: center;
        min-height: calc(100vh - 102px);
      }

      .copy {
        max-width: 660px;
      }

      h1 {
        margin: 0 0 18px;
        color: #fff7d7;
        font-size: clamp(42px, 7vw, 76px);
        line-height: 1.06;
        letter-spacing: 0;
        text-shadow: 0 8px 22px rgba(67, 32, 18, 0.46);
      }

      .lead {
        margin: 0;
        color: rgba(255, 250, 241, 0.9);
        font-size: 18px;
        line-height: 1.8;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 24px 0 0;
      }

      .meta span {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff8e7;
        font-weight: 800;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }

      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 104px;
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        color: #17130d;
        font-weight: 900;
        text-decoration: none;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        filter: saturate(0.86);
      }

      #startButton {
        background: linear-gradient(180deg, #b8ff81, var(--green));
        box-shadow: 0 16px 36px rgba(72, 187, 56, 0.28);
      }

      .button {
        background: linear-gradient(180deg, #8dd2ff, var(--blue));
      }

      .stage {
        position: relative;
        width: min(100%, 390px);
        aspect-ratio: 750 / 1624;
        justify-self: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        background: #17130d;
        box-shadow: 0 24px 90px rgba(60, 28, 16, 0.38);
      }

      .stage:fullscreen {
        width: min(100vw, calc(100vh * 750 / 1624));
        height: min(100vh, calc(100vw * 1624 / 750));
        margin: auto;
        border: 0;
        border-radius: 0;
        background: #05070a;
        box-shadow: none;
      }

      .stage:-webkit-full-screen {
        width: min(100vw, calc(100vh * 750 / 1624));
        height: min(100vh, calc(100vw * 1624 / 750));
        margin: auto;
        border: 0;
        border-radius: 0;
        background: #05070a;
        box-shadow: none;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #17130d;
      }

      .placeholder,
      #loadingPanel {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        text-align: center;
      }

      .placeholder {
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.92), transparent 17%),
          linear-gradient(180deg, rgba(255, 223, 170, 0.96), rgba(226, 180, 129, 0.94));
      }

      .placeholder strong {
        display: block;
        margin-bottom: 14px;
        color: #6c321c;
        font-size: 34px;
        line-height: 1.2;
      }

      .placeholder p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-weight: 800;
      }

      #loadingPanel {
        display: none;
        background: rgba(42, 32, 23, 0.76);
      }

      .progress {
        width: min(280px, 80%);
      }

      .progress span {
        display: block;
        margin-bottom: 12px;
        color: #fff8e7;
        font-weight: 900;
      }

      .progress-track {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.24);
      }

      #progressFill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7ae35b, #ffe28b);
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        bottom: 18px;
        z-index: 10;
        width: min(680px, calc(100% - 32px));
        transform: translateX(-50%);
      }

      #unity-warning div {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        color: #10141a;
        background: #ffe28b;
        font-weight: 800;
      }

      .fullscreen {
        position: absolute;
        right: 10px;
        top: 10px;
        display: none;
        min-height: 38px;
        min-width: 60px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        background: rgba(0, 0, 0, 0.36);
      }

      .is-running .placeholder {
        display: none;
      }

      .is-running .fullscreen {
        display: inline-flex;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
          gap: 24px;
          min-height: auto;
          padding-top: 28px;
        }

        .copy {
          max-width: none;
        }

        .stage {
          width: min(100%, 390px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a href="../../index.html#games">&#36820;&#22238;&#23567;&#28216;&#25103;&#38598;&#21512;</a>
        <span>Unity WebGL &#183; &#39318;&#27425;&#21152;&#36733;&#32422; 31MB</span>
      </header>

      <main class="layout">
        <section class="copy">
          <h1>&#35013;&#20102;&#20010;&#21861;</h1>
          <p class="lead">
            页面先快速打开，点击开始后再加载 Unity WebGL 资源。玩家以安检员视角使用 X 光机、人工复核和灰度片，判断行李是否符合刀具、火种、压力罐和 100ml 液体规则。
          </p>
          <div class="meta">
            <span>Unity WebGL</span>
            <span>X 光判读</span>
            <span>100ml 液体规则</span>
          </div>
          <div class="actions">
            <button id="startButton" type="button">&#24320;&#22987;&#20307;&#39564;</button>
            <a class="button" href="../../index.html#games">&#36820;&#22238;&#21512;&#38598;</a>
          </div>
        </section>

        <section id="stage" class="stage" aria-label="&#35013;&#20102;&#20010;&#21861;&#28216;&#25103;&#31383;&#21475;">
          <canvas id="unity-canvas" width="750" height="1624" tabindex="-1"></canvas>
          <div class="placeholder">
            <div>
              <strong>&#35013;&#20102;&#20010;&#21861;</strong>
              <p>&#28857;&#20987;&#24038;&#20391;&#25353;&#38062;&#21518;&#20877;&#21152;&#36733;&#28216;&#25103;&#36164;&#28304;&#65292;&#39318;&#27425;&#21152;&#36733;&#38656;&#35201;&#31561;&#24453;&#19968;&#23567;&#27573;&#26102;&#38388;&#12290;</p>
            </div>
          </div>
          <div id="loadingPanel">
            <div class="progress">
              <span id="loadingText">&#27491;&#22312;&#20934;&#22791;&#36164;&#28304;...</span>
              <div class="progress-track"><div id="progressFill"></div></div>
            </div>
          </div>
          <button id="fullscreenButton" class="fullscreen" type="button">&#20840;&#23631;</button>
        </section>
      </main>
    </div>

    <div id="unity-warning"></div>

    <script>
      const stage = document.querySelector("#stage");
      const canvas = document.querySelector("#unity-canvas");
      const startButton = document.querySelector("#startButton");
      const loadingPanel = document.querySelector("#loadingPanel");
      const loadingText = document.querySelector("#loadingText");
      const progressFill = document.querySelector("#progressFill");
      const fullscreenButton = document.querySelector("#fullscreenButton");
      const warningBanner = document.querySelector("#unity-warning");
      let unityInstance = null;
      let loadingStarted = false;

      function unityShowBanner(msg, type) {
        const div = document.createElement("div");
        div.textContent = msg;
        if (type === "error") div.style.background = "#ff7474";
        warningBanner.appendChild(div);
        if (type !== "error") {
          window.setTimeout(() => div.remove(), 5000);
        }
      }

      function syncCanvasResolution() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const rect = stage.getBoundingClientRect();
        const width = Math.max(1, Math.round(rect.width * ratio));
        const height = Math.max(1, Math.round(rect.height * ratio));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
      }

      function loadGame() {
        if (loadingStarted) return;
        if (window.location.protocol === "file:") {
          unityShowBanner("\u0055\u006e\u0069\u0074\u0079\u0020\u0057\u0065\u0062\u0047\u004c\u0020\u9700\u8981\u901a\u8fc7\u0020\u0068\u0074\u0074\u0070\u003a\u002f\u002f\u0020\u6216\u0020\u0068\u0074\u0074\u0070\u0073\u003a\u002f\u002f\u0020\u6253\u5f00\uff0c\u8bf7\u4f7f\u7528\u0020\u0047\u0069\u0074\u0048\u0075\u0062\u0020\u0050\u0061\u0067\u0065\u0073\u0020\u94fe\u63a5\u6216\u672c\u5730\u0020\u0057\u0065\u0062\u0020\u670d\u52a1\u3002", "error");
          return;
        }

        loadingStarted = true;
        startButton.disabled = true;
        startButton.textContent = "\u52a0\u8f7d\u4e2d...";
        stage.classList.add("is-running");
        loadingPanel.style.display = "grid";
        syncCanvasResolution();

        const buildUrl = "Build";
        const buildVersion = "20260707-tray-layout-v2";
        const config = {
          dataUrl: buildUrl + "/WebGL.data?v=" + buildVersion,
          frameworkUrl: buildUrl + "/WebGL.framework.js?v=" + buildVersion,
          codeUrl: buildUrl + "/WebGL.wasm?v=" + buildVersion,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "CodexPrototype",
          productName: "\u88c5\u4e86\u4e2a\u5565",
          productVersion: "0.1.0",
          showBanner: unityShowBanner,
          autoSyncPersistentDataPath: true,
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
        };

        const script = document.createElement("script");
        script.src = buildUrl + "/WebGL.loader.js?v=" + buildVersion;
        script.onload = () => {
          createUnityInstance(canvas, config, progress => {
            const percent = Math.round(progress * 100);
            progressFill.style.width = percent + "%";
            loadingText.textContent = "\u6b63\u5728\u52a0\u8f7d\u8d44\u6e90 " + percent + "%";
          }).then(instance => {
            unityInstance = instance;
            loadingPanel.style.display = "none";
            startButton.textContent = "\u6e38\u620f\u5df2\u542f\u52a8";
          }).catch(message => {
            startButton.disabled = false;
            startButton.textContent = "\u91cd\u65b0\u52a0\u8f7d";
            loadingPanel.style.display = "none";
            loadingStarted = false;
            unityShowBanner(message, "error");
          });
        };
        script.onerror = () => {
          startButton.disabled = false;
          startButton.textContent = "\u91cd\u65b0\u52a0\u8f7d";
          loadingPanel.style.display = "none";
          loadingStarted = false;
          unityShowBanner("\u0055\u006e\u0069\u0074\u0079\u0020\u52a0\u8f7d\u811a\u672c\u5931\u8d25\uff0c\u8bf7\u5237\u65b0\u540e\u91cd\u8bd5\u3002", "error");
        };
        document.body.appendChild(script);
      }

      syncCanvasResolution();
      window.addEventListener("resize", syncCanvasResolution);
      startButton.addEventListener("click", loadGame);
      fullscreenButton.addEventListener("click", () => {
        if (stage.requestFullscreen) {
          stage.requestFullscreen();
        } else if (stage.webkitRequestFullscreen) {
          stage.webkitRequestFullscreen();
        } else if (unityInstance) {
          unityInstance.SetFullscreen(1);
        }
      });
      document.addEventListener("fullscreenchange", syncCanvasResolution);
      document.addEventListener("webkitfullscreenchange", syncCanvasResolution);
    </script>
  </body>
</html>

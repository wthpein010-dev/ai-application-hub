<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Codex 待确认悬浮助手 75 秒安全交互演示视频。" />
    <link rel="icon" href="data:," />
    <title>Codex 待确认悬浮助手演示视频</title>
    <link rel="stylesheet" href="../../../assets/hub-video-player.css" />
  </head>
  <body data-hub-video-page>
    <a class="hub-video-home" href="../../../index.html#apps">返回主页</a>
    <main class="hub-video-page">
      <p class="hub-video-kicker">75 秒教程视频</p>
      <h1>Codex 待确认悬浮助手</h1>
      <p class="hub-video-description">使用完全合成的任务演示：扫描后显示悬浮栏、拖动位置、单条确认、失败保留、重试，以及一键全部确认。视频不包含任何真实聊天、账户或本机路径。</p>
      <section class="hub-video-player" aria-label="Codex 待确认悬浮助手演示视频">
        <div class="hub-video-stage">
          <div class="hub-video-load-card" id="loadCard" role="status">
            <strong>准备播放演示视频</strong>
            <p data-hub-video-message>点击后再加载 75 秒 H.264 视频，默认显示简体中文字幕。</p>
            <button id="loadVideo" type="button">加载并播放视频</button>
          </div>
          <video id="introVideo" controls playsinline preload="none" data-src="./codex-confirmation-bar-demo.mp4" poster="./poster.jpg" hidden><track kind="captions" src="./codex-confirmation-bar-demo.vtt" srclang="zh-CN" label="简体中文" default /></video>
        </div>
      </section>
      <nav class="hub-video-actions" aria-label="视频相关入口">
        <a href="./codex-confirmation-bar-demo.mp4">打开 MP4</a>
        <a href="../index.html">打开交互演示</a>
      </nav>
      <section class="hub-video-chapters" aria-label="视频章节">
        <button class="hub-video-chapter" type="button" data-time="0"><time>00:00</time><span>安全模拟说明</span></button>
        <button class="hub-video-chapter" type="button" data-time="11"><time>00:11</time><span>扫描并显示候选</span></button>
        <button class="hub-video-chapter" type="button" data-time="23"><time>00:23</time><span>拖动悬浮栏</span></button>
        <button class="hub-video-chapter" type="button" data-time="36"><time>00:36</time><span>单条确认继续</span></button>
        <button class="hub-video-chapter" type="button" data-time="49"><time>00:49</time><span>失败保留与重试</span></button>
        <button class="hub-video-chapter" type="button" data-time="62"><time>01:02</time><span>一键全部确认</span></button>
      </section>
    </main>
    <script type="module" src="../../../assets/hub-video-player.js"></script>
  </body>
</html>

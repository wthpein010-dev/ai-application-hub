<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="&#x4EC5;&#x4ECB;&#x7ECD;&#x516C;&#x5F00;&#x8D44;&#x6E90;&#x626B;&#x63CF;&#x6D41;&#x7A0B;&#x7684;&#x6559;&#x7A0B;&#x89C6;&#x9891;&#x3002;" />
    <title>&#x7F51;&#x9875;&#x7D20;&#x6750;&#x4E00;&#x952E;&#x6536;&#x684C;&#x9762;&#x7248; &#x6F14;&#x793A;&#x89C6;&#x9891;</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #111820;
        --panel: #19242f;
        --line: #3a4a58;
        --text: #f2f6f8;
        --muted: #aebbc5;
        --accent: #66d5bd;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--text);
        background: var(--page);
        font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .home-link {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        background: #141e27;
        font-size: 14px;
        text-decoration: none;
      }

      .home-link:hover, .text-link:hover { color: var(--accent); }

      main {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: 94px 0 48px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
      }

      h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.15; }

      .intro {
        max-width: 44em;
        margin: 14px 0 24px;
        color: var(--muted);
        line-height: 1.7;
      }

      .player {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .load-card {
        display: grid;
        min-height: 270px;
        place-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }

      .load-card p { margin: 0; color: var(--muted); line-height: 1.6; }

      button {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #7ae6ce;
        border-radius: 7px;
        color: #10201d;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #080d12;
      }

      [hidden] { display: none !important; }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 18px;
      }

      .text-link { color: var(--muted); font-size: 14px; }

      @media (max-width: 560px) {
        main { width: min(100% - 24px, 900px); padding-top: 84px; }
        .home-link { top: 12px; left: 12px; }
        .load-card { min-height: 220px; }
      }
    </style>
  </head>
  <body>
    <a class="home-link" href="../../../../../index.html#apps">&#x8FD4;&#x56DE;&#x5168;&#x90E8;&#x9879;&#x76EE;&#x603B;&#x89C8;</a>
    <main>
      <p class="eyebrow">&#x6559;&#x7A0B;&#x89C6;&#x9891;</p>
      <h1>&#x7F51;&#x9875;&#x7D20;&#x6750;&#x4E00;&#x952E;&#x6536;&#x684C;&#x9762;&#x7248;</h1>
      <p class="intro">&#x672C;&#x89C6;&#x9891;&#x4EC5;&#x8BB2;&#x89E3;&#x516C;&#x5F00;&#x8D44;&#x6E90;&#x7684;&#x626B;&#x63CF;&#x4E0E;&#x6574;&#x7406;&#x6D41;&#x7A0B;&#xFF0C;&#x4E0D;&#x6D89;&#x53CA;&#x7ED5;&#x8FC7;&#x767B;&#x5F55;&#x3001;&#x4ED8;&#x8D39;&#x5899;&#x6216;&#x7F51;&#x7AD9;&#x6743;&#x9650;&#x9650;&#x5236;&#x3002;</p>

      <section class="player" aria-label="&#x6559;&#x7A0B;&#x89C6;&#x9891;&#x64AD;&#x653E;&#x5668;">
        <div class="load-card">
          <p>&#x89C6;&#x9891;&#x5C06;&#x5728;&#x70B9;&#x51FB;&#x540E;&#x52A0;&#x8F7D;&#x3002;</p>
          <button id="loadVideo" type="button">&#x52A0;&#x8F7D;&#x5E76;&#x64AD;&#x653E;&#x89C6;&#x9891;</button>
        </div>
        <video id="introVideo" controls playsinline preload="none" data-src="./web-media-collector-tutorial.mp4" hidden>
          &#x5F53;&#x524D;&#x6D4F;&#x89C8;&#x5668;&#x4E0D;&#x652F;&#x6301;&#x89C6;&#x9891;&#x64AD;&#x653E;&#x3002;
        </video>
      </section>

      <nav class="links" aria-label="&#x76F8;&#x5173;&#x94FE;&#x63A5;">
        <a class="text-link" href="./web-media-collector-tutorial.mp4">&#x76F4;&#x63A5;&#x6253;&#x5F00; MP4</a>
        <a class="text-link" href="../index.html">&#x6253;&#x5F00;&#x5DE5;&#x5177;&#x8BF4;&#x660E;</a>
        <a class="text-link" href="../../../../../index.html#apps">&#x8FD4;&#x56DE;&#x5168;&#x90E8;&#x9879;&#x76EE;&#x603B;&#x89C8;</a>
      </nav>
    </main>
    <script>
      const video = document.querySelector('#introVideo');
      const loadButton = document.querySelector('#loadVideo');
      const loadCard = document.querySelector('.load-card');

      loadButton.addEventListener('click', () => {
        if (!video.src) video.src = video.dataset.src;
        loadCard.hidden = true;
        video.hidden = false;
        video.play().catch(() => video.load());
      }, { once: true });
    </script>
  </body>
</html>

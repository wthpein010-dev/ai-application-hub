<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网页素材一键收</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="../assets/icon.png" alt="" class="brand-icon">
          <div>
            <h1>网页素材一键收</h1>
            <p id="pageTitle">输入网页地址后开始扫描</p>
          </div>
        </div>
        <div class="header-actions">
          <label class="toggle" title="始终置顶">
            <input id="topToggle" type="checkbox" checked>
            <span>置顶</span>
          </label>
          <button id="openFolderButton" class="icon-button" title="打开下载目录" aria-label="打开下载目录">□</button>
        </div>
      </header>

      <section class="toolbar" aria-label="扫描工具">
        <form id="scanForm" class="url-row">
          <label class="url-field">
            <span>网页 URL</span>
            <input id="urlInput" type="url" placeholder="https://example.com/page" autocomplete="url" required>
          </label>
          <button id="scanButton" class="primary" type="submit">扫描</button>
        </form>

        <div class="filter-grid">
          <label>
            搜索
            <input id="searchInput" type="search" placeholder="筛 URL 或文件名">
          </label>
          <label>
            最小宽度
            <input id="minWidthInput" type="number" min="0" step="50" placeholder="0">
          </label>
          <label>
            最小高度
            <input id="minHeightInput" type="number" min="0" step="50" placeholder="0">
          </label>
        </div>

        <div class="tabs" role="tablist" aria-label="资源类型">
          <button class="tab is-active" data-kind="all" type="button">全部</button>
          <button class="tab" data-kind="image" type="button">图片</button>
          <button class="tab" data-kind="video" type="button">视频</button>
          <button class="tab" data-kind="audio" type="button">音频</button>
          <button class="tab" data-kind="document" type="button">文档</button>
        </div>
      </section>

      <section class="summary" aria-live="polite">
        <div><strong id="visibleCount">0</strong><span>可见资源</span></div>
        <div><strong id="selectedCount">0</strong><span>已选择</span></div>
        <div><strong id="totalCount">0</strong><span>总计</span></div>
      </section>

      <section class="actions">
        <button id="selectAllButton" type="button">选择可见</button>
        <button id="clearButton" type="button">清空选择</button>
        <button id="downloadButton" class="primary" type="button">下载选中</button>
      </section>

      <section id="status" class="status">等待输入网页地址。</section>
      <section id="list" class="list" aria-label="资源列表"></section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>

  <body data-hub-video-page>
    <a class="hub-video-home" href="../../../index.html#engineering">返回主页</a>
    <main class="hub-video-page">
      <p class="hub-video-kicker">55 秒功能演示</p>

      <section class="hub-video-player" aria-label="V曲线对比工具介绍视频">
        <div class="hub-video-stage">

          </div>
          <video id="introVideo" controls playsinline preload="none" data-src="./v-curve-tool-demo.mp4" poster="./poster.jpg" hidden>
            <track kind="captions" src="./v-curve-tool-demo.vtt" srclang="zh-CN" label="简体中文字幕" default>
          </video>
        </div>
      </section>
      <nav class="hub-video-actions" aria-label="视频相关入口">
        <a href="./v-curve-tool-demo.mp4">打开视频文件</a>
        <a href="../index.html">打开项目</a>

      <section class="hub-video-chapters" aria-label="视频章节">

        <button class="hub-video-chapter" type="button" data-time="36"><time>00:36</time><span>悬停读数与河道说明</span></button>
        <button class="hub-video-chapter" type="button" data-time="45"><time>00:45</time><span>导出完整分析报告</span></button>
      </section>
    </main>
    <script type="module" src="../../../assets/hub-video-player.js"></script>

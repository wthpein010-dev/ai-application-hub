<!doctype html><html lang="zh-CN"><head><link rel="stylesheet" href="../../assets/subpage-shell.css"><link rel="stylesheet" href="../../assets/admin-download-gate.css"><script type="module" src="../../assets/admin-download-gate.mjs"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf5e0"><title>小云朵搬家 · 手机触控版 1.1.0</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#faf5e0;font-family:system-ui,sans-serif;color:#293e47}#stage{position:absolute;inset:0;overflow:hidden;padding-top:max(env(safe-area-inset-top,0px),var(--safe-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}canvas{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px}h1{font-size:38px}progress{accent-color:#76c9ad;width:min(260px,75vw);margin:auto}#error{color:#a94252;white-space:pre-wrap}#home,#about{position:fixed;top:max(4px,env(safe-area-inset-top,0px));min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;background:#faf5e0cc;border-radius:8px;padding:4px 8px;font-size:11px;color:#293e47;text-decoration:none;z-index:2}#home{left:max(6px,env(safe-area-inset-left,0px))}#about{right:max(6px,env(safe-area-inset-right,0px))}.hub-home-link{top:max(4px,env(safe-area-inset-top,0px))!important;bottom:auto!important;left:max(6px,env(safe-area-inset-left,0px))!important;min-width:44px!important;min-height:44px!important;padding:4px 8px!important;font-size:11px!important}</style></head><body class="hub-subpage"><div id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="小云朵搬家。单指轻点黄色风车旋转风向，点出发送云朵回家。"></canvas></div><span id="state" aria-live="polite" style="position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden"></span><div id="loading"><h1>☁ 小云朵搬家</h1><p>手机触控版 · 正在准备花园…</p><progress id="progress" max="1" value="0"></progress><p id="error"></p></div><a class="hub-home-link" id="home" href="../../index.html#games">← 展厅</a><a id="about" href="about.html">玩法 / 工程</a><script src="Build/WebGL.loader.js?v=1.1.0"></script><script>const canvas=document.querySelector('canvas');const signal=name=>window.cloudInstance?.SendMessage('CloudletHome',name);canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});canvas.addEventListener('touchcancel',()=>signal('CancelInput'),{capture:true});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')signal('CancelInput')});window.addEventListener('blur',()=>signal('PauseForBrowser'));document.addEventListener('visibilitychange',()=>{if(document.hidden)signal('PauseForBrowser')});window.addEventListener('resize',()=>signal('CancelInput'));createUnityInstance(canvas,{dataUrl:'Build/WebGL.data?v=1.1.0',frameworkUrl:'Build/WebGL.framework.js?v=1.1.0',codeUrl:'Build/WebGL.wasm?v=1.1.0',streamingAssetsUrl:'StreamingAssets',companyName:'Cloud Garden',productName:'小云朵搬家',productVersion:'1.1.0',devicePixelRatio:Math.min(devicePixelRatio||1,1.5)},p=>document.querySelector('progress').value=p).then(i=>{window.cloudInstance=i;document.querySelector('#loading').style.display='none'}).catch(e=>document.querySelector('#error').textContent='花园载入失败，请使用支持 WebGL 的浏览器重试。'+e);</script></body></html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6f9d4b">
    <title>馕坑排排香</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <a class="hub-return" href="../../index.html#games">返回主页</a>
    <main id="unity-shell" aria-label="馕坑排排香 WebGL 试玩">
      <div id="unity-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-bar" role="status" aria-live="polite">
          <div class="nang-mark">馕</div>
          <div class="loading-title">馕宝正在生火…</div>
          <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
          <div class="loading-tip">第一次加载需要一点时间</div>
        </div>
        <div id="unity-warning"></div>
      </div>
      <button id="unity-fullscreen-button" type="button" aria-label="全屏">全屏</button>
    </main>
    <script>
      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingBar = document.querySelector('#unity-loading-bar');
      const progressBarFull = document.querySelector('#unity-progress-bar-full');
      const warningBanner = document.querySelector('#unity-warning');
      const fullscreenButton = document.querySelector('#unity-fullscreen-button');

      function unityShowBanner(message, type) {
        const item = document.createElement('div');
        item.textContent = message;
        item.className = type || 'warning';
        warningBanner.appendChild(item);
        warningBanner.style.display = 'block';
        if (type !== 'error') {
          setTimeout(() => {
            item.remove();
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
          }, 5000);
        }
      }

      const buildUrl = 'Build';
      const loaderUrl = buildUrl + '/WebGL.loader.js';
      const config = {
        dataUrl: buildUrl + '/WebGL.data',
        frameworkUrl: buildUrl + '/WebGL.framework.js',
        codeUrl: buildUrl + '/WebGL.wasm',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Internal",
        productName: "馕坑排排香",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      const script = document.createElement('script');
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = `${Math.round(progress * 100)}%`;
        }).then((unityInstance) => {
          loadingBar.style.display = 'none';
          fullscreenButton.addEventListener('click', () => unityInstance.SetFullscreen(1));
        }).catch((error) => {
          unityShowBanner(String(error), 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

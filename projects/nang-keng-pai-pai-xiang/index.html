<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6f9d4b">
    <title>馕坑排排香</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <a class="hub-return" href="../../index.html#games">返回主页</a>
    <main id="unity-shell" aria-label="馕坑排排香 WebGL 试玩">
      <div id="unity-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-bar" role="status" aria-live="polite">
          <div class="nang-mark">馕</div>
          <div class="loading-title">馕宝正在生火…</div>
          <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
          <div class="loading-tip">第一次加载需要一点时间</div>
        </div>
        <div id="unity-warning"></div>
      </div>
      <button id="unity-fullscreen-button" type="button" aria-label="全屏">全屏</button>
    </main>
    <script>
      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingBar = document.querySelector('#unity-loading-bar');
      const progressBarFull = document.querySelector('#unity-progress-bar-full');
      const warningBanner = document.querySelector('#unity-warning');
      const fullscreenButton = document.querySelector('#unity-fullscreen-button');

      function unityShowBanner(message, type) {
        const item = document.createElement('div');
        item.textContent = message;
        item.className = type || 'warning';
        warningBanner.appendChild(item);
        warningBanner.style.display = 'block';
        if (type !== 'error') {
          setTimeout(() => {
            item.remove();
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
          }, 5000);
        }
      }

      const buildUrl = 'Build';
      const loaderUrl = buildUrl + '/WebGL.loader.js';
      const config = {
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Internal",
        productName: "馕坑排排香",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      const compressedAssets = [
        { key: 'dataUrl', url: buildUrl + '/WebGL.data.gz', size: 15803435, type: 'application/octet-stream' },
        { key: 'frameworkUrl', url: buildUrl + '/WebGL.framework.js.gz', size: 88288, type: 'text/javascript' },
        { key: 'codeUrl', url: buildUrl + '/WebGL.wasm.gz', size: 3443318, type: 'application/wasm' }
      ];
      const assetProgress = new Map(compressedAssets.map(asset => [asset.key, 0]));
      const assetUrls = [];

      function updateDownloadProgress() {
        const loaded = compressedAssets.reduce((sum, asset) => sum + assetProgress.get(asset.key) * asset.size, 0);
        const total = compressedAssets.reduce((sum, asset) => sum + asset.size, 0);
        progressBarFull.style.width = `${Math.round((loaded / total) * 75)}%`;
      }

      async function decompressAsset(asset) {
        if (!window.DecompressionStream) {
          throw new Error('\u5f53\u524d\u6d4f\u89c8\u5668\u4e0d\u652f\u6301\u8d44\u6e90\u89e3\u538b\uff0c\u8bf7\u66f4\u65b0\u6d4f\u89c8\u5668\u540e\u91cd\u8bd5\u3002');
        }

        const response = await fetch(asset.url, { cache: 'force-cache' });
        if (!response.ok) {
          throw new Error(`\u8d44\u6e90\u52a0\u8f7d\u5931\u8d25\uff1a${response.status}`);
        }

        const reader = response.body?.getReader();
        const chunks = [];
        let loaded = 0;
        if (reader) {
          while (true) {
            const result = await reader.read();
            if (result.done) break;
            chunks.push(result.value);
            loaded += result.value.byteLength;
            assetProgress.set(asset.key, Math.min(loaded / asset.size, 1));
            updateDownloadProgress();
          }
        } else {
          chunks.push(new Uint8Array(await response.arrayBuffer()));
        }

        assetProgress.set(asset.key, 1);
        updateDownloadProgress();
        const compressed = new Blob(chunks);
        const decompressed = await new Response(
          compressed.stream().pipeThrough(new DecompressionStream("gzip"))
        ).arrayBuffer();
        const objectUrl = URL.createObjectURL(new Blob([decompressed], { type: asset.type }));
        assetUrls.push(objectUrl);
        return [asset.key, objectUrl];
      }

      async function startUnity() {
        try {
          Object.assign(config, Object.fromEntries(await Promise.all(compressedAssets.map(decompressAsset))));
          const script = document.createElement('script');
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = `${75 + Math.round(progress * 25)}%`;
            }).then((unityInstance) => {
              loadingBar.style.display = 'none';
              fullscreenButton.addEventListener('click', () => unityInstance.SetFullscreen(1));
            }).catch((error) => {
              unityShowBanner(String(error), 'error');
            });
          };
          script.onerror = () => unityShowBanner('\u52a0\u8f7d\u5668\u542f\u52a8\u5931\u8d25\uff0c\u8bf7\u5237\u65b0\u91cd\u8bd5\u3002', 'error');
          document.body.appendChild(script);
        } catch (error) {
          unityShowBanner(error.message || String(error), 'error');
        }
      }

      startUnity();
    </script>
  </body>
</html>

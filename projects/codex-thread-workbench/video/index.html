<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Codex 待确认悬浮助手 v2.1.8 演示视频</title>
    <link rel="stylesheet" href="../../../assets/hub-video-player.css" />
  </head>
  <body data-hub-video-page>
    <a class="hub-video-home" href="../../../index.html#apps">返回主页</a>
    <main class="hub-video-page">
      <p class="hub-video-kicker">v2.1.8 教程视频</p>
      <h1>Codex 待确认悬浮助手</h1>
      <p class="hub-video-description">86 秒看懂贴顶收纳、发现任务自动弹出、逐条确认、一键全部确认，以及 v2.1.8 的关闭保护与 Windows 一分钟自恢复，并了解桌面原生版与 iOS Web App 的能力边界。</p>
      <section class="hub-video-player" aria-label="Codex 待确认悬浮助手演示视频">
        <div class="hub-video-stage">
          <div class="hub-video-load-card" id="loadCard" role="status">
            <strong>准备播放演示视频</strong>
            <p data-hub-video-message>点击后再加载视频，避免打开页面时等待。</p>
            <button id="loadVideo" type="button">加载并播放视频</button>
          </div>
          <video id="introVideo" controls playsinline preload="none" data-src="./codex-thread-workbench-demo.mp4" poster="./poster.jpg" hidden><track
            kind="captions"
            src="./codex-thread-workbench-demo.vtt"
            srclang="zh"
            label="简体中文字幕"
            default
          /></video>
        </div>
      </section>
      <nav class="hub-video-actions" aria-label="视频相关入口">
        <a href="./codex-thread-workbench-demo.mp4">打开 MP4</a>
        <a href="../index.html">打开项目</a>
      </nav>
      <section class="hub-video-chapters" aria-label="视频章节">
        <button class="hub-video-chapter" type="button" data-time="0"><time>00:00</time><span>认识待确认悬浮助手</span></button>
        <button class="hub-video-chapter" type="button" data-time="12"><time>00:12</time><span>无候选时贴顶收纳</span></button>
        <button class="hub-video-chapter" type="button" data-time="24"><time>00:24</time><span>发现候选后自动弹出</span></button>
        <button class="hub-video-chapter" type="button" data-time="36"><time>00:36</time><span>逐条确认继续</span></button>
        <button class="hub-video-chapter" type="button" data-time="48"><time>00:48</time><span>一键全部确认并收回</span></button>
        <button class="hub-video-chapter" type="button" data-time="60"><time>01:00</time><span>关闭保护与一分钟自恢复</span></button>
        <button class="hub-video-chapter" type="button" data-time="72"><time>01:12</time><span>桌面与 iOS 能力边界</span></button>
      </section>
    </main>
    <script type="module" src="../../../assets/hub-video-player.js"></script>

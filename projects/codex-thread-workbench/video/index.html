<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="用 75 秒了解 Codex 多会话工作台如何在同一界面查看、对话和维护多个任务。"
    />
    <meta name="theme-color" content="#edf1f2" />
    <title>Codex 多会话工作台｜75 秒视频说明</title>
    <style>
      :root {
        color-scheme: light;
        --page: #edf1f2;
        --panel: #fafbfb;
        --line: #d5dde0;
        --ink: #1d282d;
        --muted: #647078;
        --accent: #24986a;
        --accent-dark: #19764f;
        --blue: #317ec7;
        --shadow: 0 24px 70px rgba(45, 61, 68, 0.13);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 14% 0%, rgba(255, 255, 255, 0.96), transparent 34rem),
          var(--page);
        font-family:
          "Microsoft YaHei UI",
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          "Segoe UI",
          sans-serif;
      }

      a, button { -webkit-tap-highlight-color: transparent; }

      .back {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 3;
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        gap: 8px;
        padding: 0 15px;
        border: 1px solid rgba(202, 212, 216, 0.95);
        border-radius: 11px;
        color: var(--ink);
        background: rgba(250, 251, 251, 0.92);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        backdrop-filter: blur(16px);
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 92px 0 54px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.13em;
      }

      h1 {
        max-width: 850px;
        margin: 0;
        font-size: clamp(34px, 6vw, 62px);
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      h1 span { color: var(--accent); }

      .intro {
        max-width: 760px;
        margin: 18px 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
      }

      .player {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #11191d;
        box-shadow: var(--shadow);
      }

      .load-card {
        display: grid;
        min-height: 540px;
        place-content: center;
        gap: 15px;
        padding: 34px;
        color: #f6fbf9;
        text-align: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(63, 202, 145, 0.2), transparent 36%),
          linear-gradient(145deg, #18282d, #10181c);
      }

      .play-mark {
        display: grid;
        width: 66px;
        height: 66px;
        margin: 0 auto 4px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 50%;
        color: #0b261a;
        background: #61d7a2;
        font-size: 24px;
        box-shadow: 0 12px 36px rgba(50, 186, 128, 0.28);
      }

      .load-card strong { font-size: clamp(24px, 4vw, 38px); }

      .load-card p {
        max-width: 560px;
        margin: 0;
        color: #aebfc3;
        line-height: 1.7;
      }

      button {
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 11px;
        color: #092218;
        background: #61d7a2;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #10181c;
      }

      [hidden] { display: none !important; }

      .chapters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }

      .chapter {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
        min-height: 66px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--ink);
        background: rgba(250, 251, 251, 0.84);
        text-align: left;
      }

      .chapter:hover { border-color: #a9c6b9; background: var(--panel); }

      .chapter time {
        color: var(--blue);
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 12px;
        font-weight: 800;
      }

      .chapter span { font-size: 14px; font-weight: 850; }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        margin-top: 22px;
      }

      .links a {
        color: var(--muted);
        font-size: 14px;
        font-weight: 750;
        text-decoration: none;
      }

      .links a:hover, .back:hover { color: var(--accent-dark); }

      @media (max-width: 760px) {
        .chapters { grid-template-columns: 1fr 1fr; }
        .load-card { min-height: 320px; }
      }

      @media (max-width: 520px) {
        main { width: min(100% - 24px, 1080px); padding-top: 78px; }
        .back { top: 12px; left: 12px; }
        .chapters { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <a class="back" href="../../../index.html#games">← 返回工具集合</a>
    <main>
      <p class="eyebrow">CODEX THREAD WORKBENCH / 75S WALKTHROUGH</p>
      <h1>多个 Codex 任务，<span>在一个界面直接处理。</span></h1>
      <p class="intro">
        视频演示任务状态、卡片内直接对话、完成与进行中的视觉区分、线程选择器、
        审批和布局管理。成片无配音，默认开启简体中文字幕。
      </p>

      <section class="player" aria-label="Codex 多会话工作台视频说明播放器">
        <div class="load-card" id="loadCard">
          <span class="play-mark" aria-hidden="true">▶</span>
          <strong>75 秒看懂多任务工作台</strong>
          <p>点击后再加载视频，进入页面时不会预先下载完整 MP4。</p>
          <button id="loadVideo" type="button">加载并播放视频</button>
        </div>
        <video
          id="introVideo"
          controls
          playsinline
          preload="none"
          data-src="./codex-thread-workbench-demo.mp4"
          poster="./poster.jpg"
          hidden
        >
          <track
            kind="captions"
            src="./codex-thread-workbench-demo.vtt"
            srclang="zh"
            label="简体中文字幕"
            default
          />
        </video>
      </section>

      <nav class="chapters" aria-label="视频章节">
        <button class="chapter" type="button" data-time="0"><time>00:00</time><span>一个界面查看多任务</span></button>
        <button class="chapter" type="button" data-time="11"><time>00:11</time><span>卡片内直接继续对话</span></button>
        <button class="chapter" type="button" data-time="23"><time>00:23</time><span>状态与任务管理</span></button>
        <button class="chapter" type="button" data-time="36"><time>00:36</time><span>选择和查找线程</span></button>
        <button class="chapter" type="button" data-time="49"><time>00:49</time><span>审批保持原位可操作</span></button>
        <button class="chapter" type="button" data-time="62"><time>01:02</time><span>全屏、恢复与安全边界</span></button>
      </nav>

      <nav class="links" aria-label="相关链接">
        <a href="./codex-thread-workbench-demo.mp4">直接打开 MP4</a>
        <a href="../index.html">打开网页交互演示</a>
        <a href="../../../index.html#games">返回工具集合</a>
      </nav>
    </main>
    <script>
      const video = document.querySelector("#introVideo");
      const loadButton = document.querySelector("#loadVideo");
      const loadCard = document.querySelector("#loadCard");

      function revealVideo({ autoplay = false } = {}) {
        if (!video.src) video.src = video.dataset.src;
        loadCard.hidden = true;
        video.hidden = false;
        if (autoplay) video.play().catch(() => video.load());
      }

      loadButton.addEventListener(
        "click",
        () => revealVideo({ autoplay: true }),
        { once: true },
      );

      document.querySelectorAll("[data-time]").forEach((chapter) => {
        chapter.addEventListener("click", () => {
          revealVideo();
          video.currentTime = Number(chapter.dataset.time);
          video.play().catch(() => video.load());
        });
      });
    </script>
  </body>
</html>

      .stage {

          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.92), transparent 17%),

      .placeholder strong {

      .progress {

      .progress span {

      }

      .progress-track {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;

      }

      #progressFill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7ae35b, #ffe28b);
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        bottom: 18px;
        z-index: 10;
        width: min(680px, calc(100% - 32px));
        transform: translateX(-50%);
      }

      #unity-warning div {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;

      }

      .fullscreen {
        position: absolute;

      .is-running .placeholder {

  <body>
    <div class="page">
      <header class="topbar">

        <span>Unity WebGL &#183; &#39318;&#27425;&#21152;&#36733;&#32422; 60MB</span>

      <main class="layout">
        <section class="copy">

          <p class="lead">
            &#39029;&#38754;&#20808;&#24555;&#36895;&#25171;&#24320;&#65292;&#28857;&#20987;&#24320;&#22987;&#21518;&#20877;&#21152;&#36733; Unity WebGL &#36164;&#28304;&#12290;&#29616;&#24050;&#25509;&#20837;&#26356;&#24555;&#30340;&#38745;&#24577;&#36164;&#28304;&#33410;&#28857;&#65292;&#39318;&#27425;&#21152;&#36733;&#38656;&#19979;&#36733;&#28216;&#25103;&#21253;&#65292;&#35831;&#20445;&#25345;&#39029;&#38754;&#25171;&#24320;&#12290;
          </p>
          <div class="meta">
            <span>Unity WebGL</span>
            <span>&#30896;&#19968;&#30896;&#28040;&#38500;</span>

            <button id="startButton" type="button">&#24320;&#22987;&#20307;&#39564;</button>
            <a class="button" href="../../downloads/paws-home-client-webgl.zip" download>Wins&#19979;&#36733;</a>
          </div>
        </section>

        <section id="stage" class="stage" aria-label="&#32650;&#20102;&#20010;&#32650;&#65306;&#30896;&#30896;&#28040;&#28216;&#25103;&#31383;&#21475;">
          <canvas id="unity-canvas" width="750" height="1334" tabindex="-1"></canvas>
          <div class="placeholder">
            <div>
              <strong>&#32650;&#20102;&#20010;&#32650;&#65306;&#30896;&#30896;&#28040;</strong>
              <p>&#28857;&#20987;&#24038;&#20391;&#25353;&#38062;&#21518;&#20877;&#21152;&#36733;&#28216;&#25103;&#36164;&#28304;&#65292;&#39318;&#27425;&#25171;&#24320;&#38656;&#35201;&#31561;&#24453;&#19979;&#36733;&#36827;&#24230;&#23436;&#25104;&#12290;</p>
            </div>
          </div>
          <div id="loadingPanel">
            <div class="progress">
              <span id="loadingText">&#27491;&#22312;&#20934;&#22791;&#36164;&#28304;...</span>
              <div class="progress-track"><div id="progressFill"></div></div>
            </div>
          </div>
          <button id="fullscreenButton" class="fullscreen" type="button">&#20840;&#23631;</button>
        </section>
      </main>
    </div>

    <div id="unity-warning"></div>

    <script>
      const stage = document.querySelector("#stage");
      const canvas = document.querySelector("#unity-canvas");
      const startButton = document.querySelector("#startButton");
      const loadingPanel = document.querySelector("#loadingPanel");
      const loadingText = document.querySelector("#loadingText");
      const progressFill = document.querySelector("#progressFill");
      const fullscreenButton = document.querySelector("#fullscreenButton");
      const warningBanner = document.querySelector("#unity-warning");
      let unityInstance = null;
      let loadingStarted = false;

      function unityShowBanner(msg, type) {
        const div = document.createElement("div");
        div.textContent = msg;
        if (type === "error") div.style.background = "#ff7474";
        warningBanner.appendChild(div);
        if (type !== "error") {
          window.setTimeout(() => div.remove(), 5000);
        }
      }

      function syncCanvasResolution() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const rect = stage.getBoundingClientRect();
        const width = Math.max(1, Math.round(rect.width * ratio));
        const height = Math.max(1, Math.round(rect.height * ratio));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
      }

      async function preloadUnityAsset(url, onProgress) {
        const response = await fetch(url, { cache: "force-cache" });
        if (!response.ok) {
          throw new Error("\u8d44\u6e90\u52a0\u8f7d\u5931\u8d25\uff1a" + response.status + " " + url);
        }
        const total = Number(response.headers.get("content-length")) || 0;
        if (!response.body || !total) {
          await response.arrayBuffer();
          onProgress(1, total);
          return;
        }

        const reader = response.body.getReader();
        let loaded = 0;
        while (true) {
          const result = await reader.read();
          if (result.done) break;
          loaded += result.value.byteLength;
          onProgress(Math.min(loaded / total, 1), total);
        }
      }

      async function preloadUnityAssets(files) {
        const progress = new Map(files.map(file => [file.url, 0]));
        const weights = new Map(files.map(file => [file.url, file.size || 1]));
        const update = () => {
          let loaded = 0;
          let total = 0;
          for (const file of files) {
            const weight = weights.get(file.url) || 1;
            loaded += (progress.get(file.url) || 0) * weight;
            total += weight;
          }
          const percent = Math.min(Math.round((loaded / total) * 80), 80);
          progressFill.style.width = percent + "%";
          loadingText.textContent = "\u6b63\u5728\u4e0b\u8f7d\u6e38\u620f\u5305 " + percent + "%";
        };

        await Promise.all(files.map(file => preloadUnityAsset(file.url, (ratio, size) => {
          progress.set(file.url, ratio);
          if (size) weights.set(file.url, size);
          update();
        })));
      }

      async function loadGame() {
        if (loadingStarted) return;
        if (window.location.protocol === "file:") {
          unityShowBanner("\u0055\u006e\u0069\u0074\u0079\u0020\u0057\u0065\u0062\u0047\u004c\u0020\u9700\u8981\u901a\u8fc7\u0020\u0068\u0074\u0074\u0070\u003a\u002f\u002f\u0020\u6216\u0020\u0068\u0074\u0074\u0070\u0073\u003a\u002f\u002f\u0020\u6253\u5f00\uff0c\u8bf7\u4f7f\u7528\u0020\u0047\u0069\u0074\u0048\u0075\u0062\u0020\u0050\u0061\u0067\u0065\u0073\u0020\u94fe\u63a5\u6216\u672c\u5730\u0020\u0057\u0065\u0062\u0020\u670d\u52a1\u3002", "error");
          return;
        }

        loadingStarted = true;
        startButton.disabled = true;
        startButton.textContent = "\u52a0\u8f7d\u4e2d...";
        stage.classList.add("is-running");
        loadingPanel.style.display = "grid";
        syncCanvasResolution();

        const buildUrl = "https://testingcf.jsdelivr.net/gh/wthpein010-dev/ai-application-hub@6e04688bdd7b03c5d2375205ad785f989ced4fa9/projects/paws-home-client/Build";
        const buildVersion = "20260714-testingcf-6e04688";
        const config = {
          dataUrl: buildUrl + "/paws-home-client-webgl.data?v=" + buildVersion,
          frameworkUrl: buildUrl + "/paws-home-client-webgl.framework.js?v=" + buildVersion,
          codeUrl: buildUrl + "/paws-home-client-webgl.wasm?v=" + buildVersion,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Joyo",
          productName: "Paws Home Client",
          productVersion: buildVersion,
          showBanner: unityShowBanner,
          autoSyncPersistentDataPath: true,
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
        };

        preloadUnityAssets([
          { url: config.dataUrl, size: 18969108 },
          { url: config.frameworkUrl, size: 446290 },
          { url: config.codeUrl, size: 40368219 }
        ]).catch(error => {
          unityShowBanner(error.message || String(error), "warning");
        }).finally(() => {
          loadUnityRuntime();
        });

        function loadUnityRuntime() {
          loadingText.textContent = "\u6b63\u5728\u542f\u52a8\u6e38\u620f...";

        const script = document.createElement("script");
        script.src = buildUrl + "/paws-home-client-webgl.loader.js?v=" + buildVersion;
        script.onload = () => {
          createUnityInstance(canvas, config, progress => {
            const percent = 80 + Math.round(progress * 20);
            progressFill.style.width = percent + "%";
            loadingText.textContent = "\u6b63\u5728\u542f\u52a8\u6e38\u620f " + percent + "%";
          }).then(instance => {
            unityInstance = instance;
            loadingPanel.style.display = "none";
            startButton.textContent = "\u6e38\u620f\u5df2\u542f\u52a8";
          }).catch(message => {
            startButton.disabled = false;
            startButton.textContent = "\u91cd\u65b0\u52a0\u8f7d";
            loadingPanel.style.display = "none";
            loadingStarted = false;
            unityShowBanner(message, "error");
          });
        };
        script.onerror = () => {
          startButton.disabled = false;
          startButton.textContent = "\u91cd\u65b0\u52a0\u8f7d";
          loadingPanel.style.display = "none";
          loadingStarted = false;
          unityShowBanner("\u0055\u006e\u0069\u0074\u0079\u0020\u52a0\u8f7d\u811a\u672c\u5931\u8d25\uff0c\u8bf7\u5237\u65b0\u540e\u91cd\u8bd5\u3002", "error");
        };
        document.body.appendChild(script);
        }
      }

      syncCanvasResolution();
      window.addEventListener("resize", syncCanvasResolution);
      startButton.addEventListener("click", loadGame);
      fullscreenButton.addEventListener("click", () => {
        if (unityInstance) unityInstance.SetFullscreen(1);
      });
    </script>

              <p>&#28857;&#20987;&#24038;&#20391;&#25353;&#38062;&#21518;&#20877;&#21152;&#36733;&#28216;&#25103;&#36164;&#28304;&#65292;&#39318;&#27425;&#21152;&#36733;&#38656;&#35201;&#31561;&#24453;&#19968;&#23567;&#27573;&#26102;&#38388;&#12290;</p>

    <div id="unity-warning"></div>

    <script>
      const stage = document.querySelector("#stage");
      const canvas = document.querySelector("#unity-canvas");
      const startButton = document.querySelector("#startButton");
      const loadingPanel = document.querySelector("#loadingPanel");
      const loadingText = document.querySelector("#loadingText");
      const progressFill = document.querySelector("#progressFill");
      const fullscreenButton = document.querySelector("#fullscreenButton");
      const warningBanner = document.querySelector("#unity-warning");
      let unityInstance = null;
      let loadingStarted = false;

      function unityShowBanner(msg, type) {
        const div = document.createElement("div");
        div.textContent = msg;
        if (type === "error") div.style.background = "#ff7474";
        warningBanner.appendChild(div);
        if (type !== "error") {
          window.setTimeout(() => div.remove(), 5000);
        }
      }

      function loadGame() {
        if (loadingStarted) return;
        if (window.location.protocol === "file:") {
          unityShowBanner("Unity WebGL 需要通过 http:// 或 https:// 打开，请使用 GitHub Pages 链接或本地 Web 服务。", "error");
          return;
        }

        loadingStarted = true;
        startButton.disabled = true;
        startButton.textContent = "加载中...";
        stage.classList.add("is-running");
        loadingPanel.style.display = "grid";

        const buildUrl = "Build";
        const buildVersion = "20260706-optimized";
        const config = {
          dataUrl: buildUrl + "/paws-home-client-webgl.data.unityweb?v=" + buildVersion,
          frameworkUrl: buildUrl + "/paws-home-client-webgl.framework.js.unityweb?v=" + buildVersion,
          codeUrl: buildUrl + "/paws-home-client-webgl.wasm.unityweb?v=" + buildVersion,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Joyo",
          productName: "Paws Home Client",
          productVersion: buildVersion,
          showBanner: unityShowBanner,
          autoSyncPersistentDataPath: true
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        }

        const script = document.createElement("script");
        script.src = buildUrl + "/paws-home-client-webgl.loader.js?v=" + buildVersion;
        script.onload = () => {
          createUnityInstance(canvas, config, progress => {
            const percent = Math.round(progress * 100);
            progressFill.style.width = percent + "%";
            loadingText.textContent = "正在加载资源 " + percent + "%";
          }).then(instance => {
            unityInstance = instance;
            loadingPanel.style.display = "none";
            startButton.textContent = "游戏已启动";
          }).catch(message => {
            startButton.disabled = false;
            startButton.textContent = "重新加载";
            loadingPanel.style.display = "none";
            loadingStarted = false;
            unityShowBanner(message, "error");
          });
        };
        script.onerror = () => {
          startButton.disabled = false;
          startButton.textContent = "重新加载";
          loadingPanel.style.display = "none";
          loadingStarted = false;
          unityShowBanner("Unity 加载脚本失败，请刷新后重试。", "error");
        };
        document.body.appendChild(script);
      }

      startButton.addEventListener("click", loadGame);
      fullscreenButton.addEventListener("click", () => {
        if (unityInstance) unityInstance.SetFullscreen(1);
      });
    </script>

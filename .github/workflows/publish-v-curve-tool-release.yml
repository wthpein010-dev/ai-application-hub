name: Publish the verified V Curve macOS release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful V Curve macOS build run ID
        required: true
        type: string
      expected_source_sha:
        description: Exact source commit recorded by that build
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v-curve-tool-v1.2.0
  cancel-in-progress: false

env:
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
  ARTIFACT_NAME: v-curve-tool-macos-release
  RELEASE_TAG: v-curve-tool-v1.2.0
  RELEASE_ID: 378411760
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  EXPECTED_ARCHIVE: V-Curve-Comparison-Tool-1.2.0-macOS.zip
  EXPECTED_WINDOWS_ARCHIVE: V-Curve-Comparison-Tool-1.2.0-Windows-x64.zip

jobs:
  publish:
    name: Promote the immutable Mac artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the manifest committed by the artifact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          sparse-checkout: projects/v-curve-tool/release-manifest.json
          sparse-checkout-cone-mode: false

      - name: Download the previously verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh run view "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,status)"
          RUN_JSON="$run_json" node - <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON);
          if (!/^[0-9a-f]{40}$/u.test(process.env.EXPECTED_SOURCE_SHA)) {
            throw new Error("expected source SHA must be a full lowercase commit id");
          }
          if (run.status !== "completed" || run.conclusion !== "success") {
            throw new Error(`artifact run is not a completed success: ${JSON.stringify(run)}`);
          }
          if (run.headSha !== process.env.EXPECTED_SOURCE_SHA) {
            throw new Error(`artifact run source drift: ${run.headSha}`);
          }
          NODE
          mkdir release-assets
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-assets

      - name: Verify provenance, bytes and digest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");
          const { join } = require("node:path");
          const root = "release-assets";
          const archive = join(root, process.env.EXPECTED_ARCHIVE);
          const metadata = JSON.parse(readFileSync(join(root, "v-curve-tool-macos-release.json"), "utf8"));
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          if (manifest.schemaVersion !== "v-curve-tool-release/1" || manifest.version !== "1.2.0") {
            throw new Error(`unexpected release manifest: ${JSON.stringify(manifest)}`);
          }
          if (manifest.assets.mac.file !== process.env.EXPECTED_ARCHIVE) {
            throw new Error(`manifest Mac asset drift: ${manifest.assets.mac.file}`);
          }
          const expected = {
            version: manifest.version,
            sourceCommit: process.env.EXPECTED_SOURCE_SHA,
            asset: process.env.EXPECTED_ARCHIVE,
            bytes: manifest.assets.mac.bytes,
            sha256: manifest.assets.mac.sha256,
            architectures: manifest.assets.mac.architectures,
            bundledFiles: manifest.bundledLevels.files,
          };
          if (JSON.stringify(metadata) !== JSON.stringify(expected)) {
            throw new Error(`artifact metadata drift: ${JSON.stringify(metadata)}`);
          }
          if (!Number.isSafeInteger(metadata.bytes) || metadata.bytes <= 0) {
            throw new Error(`invalid archive byte count: ${metadata.bytes}`);
          }
          if (!/^[A-F0-9]{64}$/u.test(metadata.sha256)) {
            throw new Error(`invalid archive digest: ${metadata.sha256}`);
          }
          if (statSync(archive).size !== metadata.bytes) {
            throw new Error(`archive byte drift: ${statSync(archive).size}`);
          }
          const digest = createHash("sha256").update(readFileSync(archive)).digest("hex").toUpperCase();
          if (digest !== metadata.sha256) throw new Error(`archive digest drift: ${digest}`);
          const [recordedDigest, recordedName] = readFileSync(`${archive}.sha256.txt`, "utf8").trim().split(/\s+/u);
          if (recordedDigest.toUpperCase() !== metadata.sha256) {
            throw new Error(`recorded digest drift: ${recordedDigest}`);
          }
          if (recordedName !== process.env.EXPECTED_ARCHIVE) {
            throw new Error(`checksum path is not portable: ${recordedName}`);
          }
          NODE

      - name: Verify the committed Windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$EXPECTED_WINDOWS_ARCHIVE" \
            --dir release-assets
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");
          const { join } = require("node:path");
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          const archive = join("release-assets", process.env.EXPECTED_WINDOWS_ARCHIVE);
          if (manifest.assets.windows.file !== process.env.EXPECTED_WINDOWS_ARCHIVE) {
            throw new Error(`manifest Windows asset drift: ${manifest.assets.windows.file}`);
          }
          if (statSync(archive).size !== manifest.assets.windows.bytes) {
            throw new Error(`Windows archive byte drift: ${statSync(archive).size}`);
          }
          const digest = createHash("sha256").update(readFileSync(archive)).digest("hex").toUpperCase();
          if (digest !== manifest.assets.windows.sha256) {
            throw new Error(`Windows archive digest drift: ${digest}`);
          }
          NODE

      - name: Upload only when the immutable assets are absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          RELEASE_JSON="$release_json" node - <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== process.env.RELEASE_TAG) {
            throw new Error(`unexpected release target: ${JSON.stringify(release)}`);
          }
          if (release.draft !== true) throw new Error("refusing to alter a Release that is already public");
          NODE
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SOURCE_SHA"

          mapfile -t expected_assets <<EOF
          $EXPECTED_ARCHIVE
          $EXPECTED_ARCHIVE.sha256.txt
          v-curve-tool-macos-release.json
          EOF
          assets_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          existing_count="$(ASSETS_JSON="$assets_json" node - <<'NODE'
          const expected = new Set([
            process.env.EXPECTED_ARCHIVE,
            `${process.env.EXPECTED_ARCHIVE}.sha256.txt`,
            "v-curve-tool-macos-release.json",
          ]);
          const release = JSON.parse(process.env.ASSETS_JSON);
          process.stdout.write(String(release.assets.filter((asset) => expected.has(asset.name)).length));
          NODE
          )"

          if [[ "$existing_count" = "0" ]]; then
            gh release upload "$RELEASE_TAG" \
              "release-assets/$EXPECTED_ARCHIVE" \
              "release-assets/$EXPECTED_ARCHIVE.sha256.txt" \
              "release-assets/v-curve-tool-macos-release.json" \
              --repo "$GITHUB_REPOSITORY"
          elif [[ "$existing_count" = "3" ]]; then
            mkdir existing-assets
            for asset in "${expected_assets[@]}"; do
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir existing-assets
              cmp --silent "release-assets/$asset" "existing-assets/$asset"
            done
            echo "The immutable Mac release assets already match; no upload was required."
          else
            echo "The Release contains a partial V curve Mac asset set; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Verify the complete manifest-bound assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          RELEASE_JSON="$release_json" node - <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          const expectedAssetNames = new Set([
            process.env.EXPECTED_WINDOWS_ARCHIVE,
            process.env.EXPECTED_ARCHIVE,
            `${process.env.EXPECTED_ARCHIVE}.sha256.txt`,
            "v-curve-tool-macos-release.json",
          ]);
          const actualAssetNames = new Set(release.assets.map((asset) => asset.name));
          if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== process.env.RELEASE_TAG || release.draft !== true) {
            throw new Error(`Release is not the expected draft: ${JSON.stringify(release)}`);
          }
          if (actualAssetNames.size !== expectedAssetNames.size
            || ![...expectedAssetNames].every((asset) => actualAssetNames.has(asset))) {
            throw new Error("The Release does not contain the complete verified V curve asset set");
          }
          NODE
          mkdir published-assets
          for asset in "$EXPECTED_WINDOWS_ARCHIVE" "$EXPECTED_ARCHIVE" "$EXPECTED_ARCHIVE.sha256.txt" v-curve-tool-macos-release.json; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir published-assets
          done
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");
          const { join } = require("node:path");
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          const root = "published-assets";
          const verifyArchive = (asset, expected) => {
            const archive = join(root, asset);
            if (statSync(archive).size !== expected.bytes) {
              throw new Error(`${asset} byte drift: ${statSync(archive).size}`);
            }
            const digest = createHash("sha256").update(readFileSync(archive)).digest("hex").toUpperCase();
            if (digest !== expected.sha256) throw new Error(`${asset} digest drift: ${digest}`);
          };
          verifyArchive(process.env.EXPECTED_WINDOWS_ARCHIVE, manifest.assets.windows);
          verifyArchive(process.env.EXPECTED_ARCHIVE, manifest.assets.mac);
          const metadata = JSON.parse(readFileSync(join(root, "v-curve-tool-macos-release.json"), "utf8"));
          const expectedMetadata = {
            version: manifest.version,
            sourceCommit: process.env.EXPECTED_SOURCE_SHA,
            asset: manifest.assets.mac.file,
            bytes: manifest.assets.mac.bytes,
            sha256: manifest.assets.mac.sha256,
            architectures: manifest.assets.mac.architectures,
            bundledFiles: manifest.bundledLevels.files,
          };
          if (JSON.stringify(metadata) !== JSON.stringify(expectedMetadata)) {
            throw new Error(`published Mac metadata drift: ${JSON.stringify(metadata)}`);
          }
          const [recordedDigest, recordedName] = readFileSync(join(root, `${process.env.EXPECTED_ARCHIVE}.sha256.txt`), "utf8").trim().split(/\s+/u);
          if (recordedDigest.toUpperCase() !== manifest.assets.mac.sha256 || recordedName !== manifest.assets.mac.file) {
            throw new Error(`published Mac checksum drift: ${recordedDigest} ${recordedName}`);
          }
          NODE

      - name: Publish only the complete verified draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          published_release="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f draft=false)"
          PUBLISHED_RELEASE="$published_release" node - <<'NODE'
          const release = JSON.parse(process.env.PUBLISHED_RELEASE);
          if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== process.env.RELEASE_TAG || release.draft !== false) {
            throw new Error(`Release publication drift: ${JSON.stringify(release)}`);
          }
          NODE

name: Publish the verified V Curve macOS release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful V Curve macOS build run ID
        required: true
        type: string
      expected_source_sha:
        description: Exact source commit recorded by that build
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v-curve-tool-v1.2.0
  cancel-in-progress: false

env:
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
  ARTIFACT_NAME: v-curve-tool-macos-release
  RELEASE_TAG: v-curve-tool-v1.2.0
  RELEASE_ID: 378411760
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  EXPECTED_ARCHIVE: V-Curve-Comparison-Tool-1.2.0-macOS.zip
  EXPECTED_WINDOWS_ARCHIVE: V-Curve-Comparison-Tool-1.2.0-Windows-x64.zip
  EXPECTED_WINDOWS_CHECKSUM: V-Curve-Comparison-Tool-1.2.0-Windows-x64.zip.sha256.txt

jobs:
  publish:
    name: Promote the immutable Mac artifact
    runs-on: ubuntu-latest
    steps:
      - name: Require a current main dispatch before reading the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "The publisher may only be dispatched from refs/heads/main." >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "The workflow SHA does not equal the current main ref." >&2
            exit 1
          fi
          echo "CURRENT_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"

      - name: Check out the manifest committed by the workflow-dispatch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            projects/v-curve-tool/release-manifest.json
            scripts/v-curve-release-publisher.mjs
          sparse-checkout-cone-mode: false

      - name: Download the previously verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh run view "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headSha,status)"
          RUN_JSON="$run_json" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertArtifactProvenance } from "./scripts/v-curve-release-publisher.mjs";
          const run = JSON.parse(process.env.RUN_JSON);
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          assertArtifactProvenance({
            manifest,
            artifactRunId: process.env.ARTIFACT_RUN_ID,
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            run,
          });
          NODE
          mkdir release-assets
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-assets

      - name: Verify provenance, bytes and digest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import {
            assertCurrentMainDispatch,
            assertMacArtifactMatchesManifest,
            assertPortableChecksum,
          } from "./scripts/v-curve-release-publisher.mjs";
          const root = "release-assets";
          const archive = join(root, process.env.EXPECTED_ARCHIVE);
          const metadata = JSON.parse(readFileSync(join(root, "v-curve-tool-macos-release.json"), "utf8"));
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          assertCurrentMainDispatch({
            githubRef: process.env.GITHUB_REF,
            githubSha: process.env.GITHUB_SHA,
            mainRefSha: process.env.CURRENT_MAIN_SHA,
          });
          if (manifest.assets.mac.file !== process.env.EXPECTED_ARCHIVE) {
            throw new Error(`manifest Mac asset drift: ${manifest.assets.mac.file}`);
          }
          assertMacArtifactMatchesManifest({
            manifest,
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            macArtifactMetadata: metadata,
          });
          if (!Number.isSafeInteger(metadata.bytes) || metadata.bytes <= 0) {
            throw new Error(`invalid archive byte count: ${metadata.bytes}`);
          }
          if (!/^[A-F0-9]{64}$/u.test(metadata.sha256)) {
            throw new Error(`invalid archive digest: ${metadata.sha256}`);
          }
          if (statSync(archive).size !== metadata.bytes) {
            throw new Error(`archive byte drift: ${statSync(archive).size}`);
          }
          const digest = createHash("sha256").update(readFileSync(archive)).digest("hex").toUpperCase();
          if (digest !== metadata.sha256) throw new Error(`archive digest drift: ${digest}`);
          assertPortableChecksum({
            content: readFileSync(`${archive}.sha256.txt`, "utf8"),
            expectedSha: metadata.sha256,
            expectedFile: process.env.EXPECTED_ARCHIVE,
            label: "Mac artifact",
          });
          NODE

      - name: Verify the committed Windows asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          RELEASE_JSON="$release_json" node - <<'NODE' > windows-asset-plan.tsv
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== process.env.RELEASE_TAG || release.draft !== true) {
            throw new Error(`Release is not the expected draft: ${JSON.stringify(release)}`);
          }
          for (const name of [process.env.EXPECTED_WINDOWS_ARCHIVE, process.env.EXPECTED_WINDOWS_CHECKSUM]) {
            const asset = release.assets.find((candidate) => candidate.name === name);
            if (!Number.isSafeInteger(asset?.id)) throw new Error(`missing Windows asset on the target Release: ${name}`);
            process.stdout.write(`${asset.id}\t${name}\n`);
          }
          NODE
          while IFS=$'\t' read -r asset_id asset; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -H "Accept: application/octet-stream" > "release-assets/$asset"
          done < windows-asset-plan.tsv
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import { assertPortableChecksum } from "./scripts/v-curve-release-publisher.mjs";
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          const archive = join("release-assets", process.env.EXPECTED_WINDOWS_ARCHIVE);
          if (manifest.assets.windows.file !== process.env.EXPECTED_WINDOWS_ARCHIVE) {
            throw new Error(`manifest Windows asset drift: ${manifest.assets.windows.file}`);
          }
          if (statSync(archive).size !== manifest.assets.windows.bytes) {
            throw new Error(`Windows archive byte drift: ${statSync(archive).size}`);
          }
          const digest = createHash("sha256").update(readFileSync(archive)).digest("hex").toUpperCase();
          if (digest !== manifest.assets.windows.sha256) {
            throw new Error(`Windows archive digest drift: ${digest}`);
          }
          assertPortableChecksum({
            content: readFileSync(join("release-assets", process.env.EXPECTED_WINDOWS_CHECKSUM), "utf8"),
            expectedSha: manifest.assets.windows.sha256,
            expectedFile: manifest.assets.windows.file,
            label: "Windows",
          });
          NODE

      - name: Upload only when the immutable assets are absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          RELEASE_JSON="$release_json" node - <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== process.env.RELEASE_TAG) {
            throw new Error(`unexpected release target: ${JSON.stringify(release)}`);
          }
          if (release.draft !== true) throw new Error("refusing to alter a Release that is already public");
          NODE
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SOURCE_SHA"

          mapfile -t expected_assets <<EOF
          $EXPECTED_ARCHIVE
          $EXPECTED_ARCHIVE.sha256.txt
          v-curve-tool-macos-release.json
          EOF
          assets_json="$release_json"
          existing_count="$(ASSETS_JSON="$assets_json" node - <<'NODE'
          const expected = new Set([
            process.env.EXPECTED_ARCHIVE,
            `${process.env.EXPECTED_ARCHIVE}.sha256.txt`,
            "v-curve-tool-macos-release.json",
          ]);
          const release = JSON.parse(process.env.ASSETS_JSON);
          process.stdout.write(String(release.assets.filter((asset) => expected.has(asset.name)).length));
          NODE
          )"
          upload_url="$(RELEASE_JSON="$release_json" node --input-type=module - <<'NODE'
          import { createExactReleaseUploadPlan } from "./scripts/v-curve-release-publisher.mjs";
          const plan = createExactReleaseUploadPlan({ release: JSON.parse(process.env.RELEASE_JSON) });
          process.stdout.write(plan.uploadUrl);
          NODE
          )"

          if [[ "$existing_count" = "0" ]]; then
            for asset in "${expected_assets[@]}"; do
              encoded_name="$(ASSET_NAME="$asset" node -e 'process.stdout.write(encodeURIComponent(process.env.ASSET_NAME))')"
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@release-assets/$asset" \
                "$upload_url?name=$encoded_name" > /dev/null
            done
          elif [[ "$existing_count" = "3" ]]; then
            mkdir existing-assets
            for asset in "${expected_assets[@]}"; do
              asset_id="$(ASSETS_JSON="$assets_json" ASSET_NAME="$asset" node -e 'const release = JSON.parse(process.env.ASSETS_JSON); const found = release.assets.find((candidate) => candidate.name === process.env.ASSET_NAME); if (!Number.isSafeInteger(found?.id)) throw new Error(`missing immutable asset: ${process.env.ASSET_NAME}`); process.stdout.write(String(found.id));')"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                -H "Accept: application/octet-stream" > "existing-assets/$asset"
              cmp --silent "release-assets/$asset" "existing-assets/$asset"
            done
            echo "The immutable Mac release assets already match; no upload was required."
          else
            echo "The Release contains a partial V curve Mac asset set; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Verify the complete manifest-bound assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          asset_plan="$(RELEASE_JSON="$release_json" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          import { createCompleteDraftReleasePlan } from "./scripts/v-curve-release-publisher.mjs";
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          const macArtifactMetadata = JSON.parse(readFileSync("release-assets/v-curve-tool-macos-release.json", "utf8"));
          const plan = createCompleteDraftReleasePlan({
            manifest,
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            release: JSON.parse(process.env.RELEASE_JSON),
            macArtifactMetadata,
          });
          process.stdout.write(JSON.stringify(plan));
          NODE
          )"
          mkdir published-assets
          PLAN_JSON="$asset_plan" node - <<'NODE' > asset-plan.tsv
          const plan = JSON.parse(process.env.PLAN_JSON);
          for (const asset of plan.assets) process.stdout.write(`${asset.id}\t${asset.name}\n`);
          NODE
          while IFS=$'\t' read -r asset_id asset; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -H "Accept: application/octet-stream" > "published-assets/$asset"
          done < asset-plan.tsv
          final_release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          RELEASE_JSON="$final_release_json" EXPECTED_PLAN="$asset_plan" node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import {
            assertPortableChecksum,
            publishVerifiedDraftRelease,
          } from "./scripts/v-curve-release-publisher.mjs";
          const manifest = JSON.parse(readFileSync("projects/v-curve-tool/release-manifest.json", "utf8"));
          const root = "published-assets";
          const verifyArchive = (asset, expected) => {
            const archive = join(root, asset);
            if (statSync(archive).size !== expected.bytes) {
              throw new Error(`${asset} byte drift: ${statSync(archive).size}`);
            }
            const digest = createHash("sha256").update(readFileSync(archive)).digest("hex").toUpperCase();
            if (digest !== expected.sha256) throw new Error(`${asset} digest drift: ${digest}`);
          };
          const macArtifactMetadata = JSON.parse(readFileSync(join(root, "v-curve-tool-macos-release.json"), "utf8"));
          await publishVerifiedDraftRelease({
            manifest,
            sourceSha: process.env.EXPECTED_SOURCE_SHA,
            release: JSON.parse(process.env.RELEASE_JSON),
            expectedPlan: JSON.parse(process.env.EXPECTED_PLAN),
            macArtifactMetadata,
            verifyAssets: async () => {
              verifyArchive(manifest.assets.windows.file, manifest.assets.windows);
              verifyArchive(manifest.assets.mac.file, manifest.assets.mac);
              assertPortableChecksum({
                content: readFileSync(join(root, `${manifest.assets.windows.file}.sha256.txt`), "utf8"),
                expectedSha: manifest.assets.windows.sha256,
                expectedFile: manifest.assets.windows.file,
                label: "published Windows",
              });
              assertPortableChecksum({
                content: readFileSync(join(root, `${manifest.assets.mac.file}.sha256.txt`), "utf8"),
                expectedSha: manifest.assets.mac.sha256,
                expectedFile: manifest.assets.mac.file,
                label: "published Mac",
              });
            },
            loadRelease: async (id) => JSON.parse(execFileSync(
              "gh",
              ["api", `repos/${process.env.GITHUB_REPOSITORY}/releases/${id}`],
              { encoding: "utf8" },
            )),
            loadTagSha: async (tag) => execFileSync(
              "gh",
              ["api", `repos/${process.env.GITHUB_REPOSITORY}/git/ref/tags/${tag}`, "--jq", ".object.sha"],
              { encoding: "utf8" },
            ).trim(),
            publish: async (id) => JSON.parse(execFileSync(
              "gh",
              ["api", "--method", "PATCH", `repos/${process.env.GITHUB_REPOSITORY}/releases/${id}`, "-F", "draft=false"],
              { encoding: "utf8" },
            )),
          });
          NODE

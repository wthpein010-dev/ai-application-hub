name: Build 游戏需求开工台 desktop release

on:
  push:
    tags:
      - "gamespec-relay-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发的游戏需求开工台版本标签"
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  windows:
    name: Windows x64 native build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: build/gamespec-relay-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: build/gamespec-relay-desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run 游戏需求开工台 tests
        run: npm test
      - name: Build Windows portable application
        run: npm run dist:win
      - name: Verify Windows package
        run: npm run verify:win
      - name: Launch packaged smoke mode
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\游戏需求开工台-微软系统.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "游戏需求开工台 Windows smoke failed with exit code $($process.ExitCode)"
          }
      - name: Package Windows download
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "游戏需求开工台-微软系统"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item ".\dist\游戏需求开工台-微软系统.exe" (Join-Path $stage "游戏需求开工台.exe")
          Copy-Item ".\README.md" (Join-Path $stage "README.md")
          $archive = Join-Path $env:RUNNER_TEMP "游戏需求开工台-微软系统.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal -Force
          Get-FileHash -Algorithm SHA256 $archive
      - uses: actions/upload-artifact@v4
        with:
          name: gamespec-relay-windows
          path: ${{ runner.temp }}/游戏需求开工台-微软系统.zip
          if-no-files-found: error
          retention-days: 14

  mac_x64:
    name: macOS Intel native build
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: build/gamespec-relay-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Intel runner architecture
        run: test "$(uname -m)" = "x86_64"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: build/gamespec-relay-desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run 游戏需求开工台 tests
        run: npm test
      - name: Build Intel application
        run: npm run dist:mac:x64
      - name: Verify Intel binary and apply ad-hoc signature
        run: |
          set -euo pipefail
          APP_BIN="$(find dist -path '*/游戏需求开工台.app/Contents/MacOS/游戏需求开工台' -type f | head -n 1)"
          test -n "$APP_BIN"
          file "$APP_BIN" | grep -q "x86_64"
          APP_DIR="$(dirname "$(dirname "$(dirname "$APP_BIN")")")"
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
      - name: Verify Intel package
        run: npm run verify:mac
      - name: Launch Intel smoke mode
        run: |
          set -euo pipefail
          APP_BIN="$(find dist -path '*/游戏需求开工台.app/Contents/MacOS/游戏需求开工台' -type f | head -n 1)"
          test -n "$APP_BIN"
          "$APP_BIN" --smoke-test
      - name: Archive Intel app without losing executable bits
        run: |
          set -euo pipefail
          APP_DIR="$(dirname "$(dirname "$(dirname "$(find dist -path '*/游戏需求开工台.app/Contents/MacOS/游戏需求开工台' -type f | head -n 1)")")")"
          tar -czf "$RUNNER_TEMP/GameSpec-Relay-macOS-x64-app.tar.gz" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
      - uses: actions/upload-artifact@v4
        with:
          name: gamespec-relay-mac-x64
          path: ${{ runner.temp }}/GameSpec-Relay-macOS-x64-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  mac_arm64:
    name: macOS Apple Silicon native build
    runs-on: macos-14
    defaults:
      run:
        working-directory: build/gamespec-relay-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Apple Silicon runner architecture
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: build/gamespec-relay-desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run 游戏需求开工台 tests
        run: npm test
      - name: Build Apple Silicon application
        run: npm run dist:mac:arm64
      - name: Verify Apple Silicon binary and apply ad-hoc signature
        run: |
          set -euo pipefail
          APP_BIN="$(find dist -path '*/游戏需求开工台.app/Contents/MacOS/游戏需求开工台' -type f | head -n 1)"
          test -n "$APP_BIN"
          file "$APP_BIN" | grep -q "arm64"
          APP_DIR="$(dirname "$(dirname "$(dirname "$APP_BIN")")")"
          codesign --force --deep --sign - "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
      - name: Verify Apple Silicon package
        run: npm run verify:mac
      - name: Launch Apple Silicon smoke mode
        run: |
          set -euo pipefail
          APP_BIN="$(find dist -path '*/游戏需求开工台.app/Contents/MacOS/游戏需求开工台' -type f | head -n 1)"
          test -n "$APP_BIN"
          "$APP_BIN" --smoke-test
      - name: Archive Apple Silicon app without losing executable bits
        run: |
          set -euo pipefail
          APP_DIR="$(dirname "$(dirname "$(dirname "$(find dist -path '*/游戏需求开工台.app/Contents/MacOS/游戏需求开工台' -type f | head -n 1)")")")"
          tar -czf "$RUNNER_TEMP/GameSpec-Relay-macOS-arm64-app.tar.gz" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
      - uses: actions/upload-artifact@v4
        with:
          name: gamespec-relay-mac-arm64
          path: ${{ runner.temp }}/GameSpec-Relay-macOS-arm64-app.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified desktop assets
    runs-on: ubuntu-latest
    needs: [windows, mac_x64, mac_arm64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble final downloads
        run: |
          set -euo pipefail
          mkdir -p release mac-combined/x64 mac-combined/arm64
          cp artifacts/gamespec-relay-windows/游戏需求开工台-微软系统.zip release/youxi-xuqiu-kaigongtai-windows-x64.zip
          tar -xzf artifacts/gamespec-relay-mac-x64/GameSpec-Relay-macOS-x64-app.tar.gz -C mac-combined/x64
          tar -xzf artifacts/gamespec-relay-mac-arm64/GameSpec-Relay-macOS-arm64-app.tar.gz -C mac-combined/arm64
          cp build/gamespec-relay-desktop/README.md mac-combined/README.md
          (
            cd mac-combined
            zip -qry ../release/youxi-xuqiu-kaigongtai-macos.zip arm64 x64 README.md
          )
          sha256sum release/youxi-xuqiu-kaigongtai-windows-x64.zip release/youxi-xuqiu-kaigongtai-macos.zip | tee release/sha256sum.txt
          test -s release/youxi-xuqiu-kaigongtai-windows-x64.zip
          test -s release/youxi-xuqiu-kaigongtai-macos.zip
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#gamespec-relay-v}"
          case "$TAG" in
            gamespec-relay-v*) ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$TAG" release/youxi-xuqiu-kaigongtai-windows-x64.zip release/youxi-xuqiu-kaigongtai-macos.zip release/sha256sum.txt \
            --verify-tag \
            --title "游戏需求开工台 $VERSION" \
            --notes-file projects/gamespec-relay/release-notes.md

name: Build ClickFlow for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - agent/clickflow-publish
    paths:
      - ".github/workflows/build-clickflow-macos.yml"
      - "build/clickflow/**"

permissions:
  contents: write

concurrency:
  group: clickflow-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            expected_arch: arm64
          - arch: x64
            runner: macos-15-intel
            expected_arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: build/clickflow
    steps:
      - name: Check out ClickFlow build inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build/clickflow
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: build/clickflow/requirements-build.txt

      - name: Build and test ClickFlow
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            auto_clicker.py clickflow_core.py clickflow_input.py clickflow_theme.py
          python -m unittest discover -s tests -v
          chmod +x scripts/build_macos.sh
          PYTHON=python bash scripts/build_macos.sh

      - name: Sign and verify the app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="dist/ClickFlow.app"
          binary="$app/Contents/MacOS/ClickFlow"
          test -d "$app"
          test -x "$binary"
          plutil -lint "$app/Contents/Info.plist"
          file "$binary" | tee "clickflow-${{ matrix.arch }}-architecture.txt"
          grep -q "${{ matrix.expected_arch }}" "clickflow-${{ matrix.arch }}-architecture.txt"
          codesign --deep --force --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Start the packaged application
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/dist/ClickFlow.app"
          binary="$app/Contents/MacOS/ClickFlow"
          open -n "$app"
          pid=""
          for attempt in {1..15}; do
            pid="$(pgrep -f "$binary" | head -n 1 || true)"
            if [ -n "$pid" ]; then
              break
            fi
            sleep 1
          done
          test -n "$pid"
          kill -0 "$pid"
          kill "$pid" || true
          for attempt in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          kill -9 "$pid" || true

      - name: Package the verified app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --keepParent \
            dist/ClickFlow.app \
            "artifacts/ClickFlow-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "artifacts/ClickFlow-macOS-${{ matrix.arch }}.zip"

      - name: Upload the native app
        uses: actions/upload-artifact@v4
        with:
          name: clickflow-macos-${{ matrix.arch }}
          path: build/clickflow/artifacts/ClickFlow-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  package:
    name: Combine verified macOS apps
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both native apps
        uses: actions/download-artifact@v4
        with:
          pattern: clickflow-macos-*
          path: artifacts/native
          merge-multiple: true

      - name: Combine and inspect the release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/arm64 package/x64 release
          unzip -q artifacts/native/ClickFlow-macOS-arm64.zip -d package/arm64
          unzip -q artifacts/native/ClickFlow-macOS-x64.zip -d package/x64
          test -f package/arm64/ClickFlow.app/Contents/Info.plist
          test -x package/arm64/ClickFlow.app/Contents/MacOS/ClickFlow
          test -f package/x64/ClickFlow.app/Contents/Info.plist
          test -x package/x64/ClickFlow.app/Contents/MacOS/ClickFlow
          file package/arm64/ClickFlow.app/Contents/MacOS/ClickFlow | grep -q arm64
          file package/x64/ClickFlow.app/Contents/MacOS/ClickFlow | grep -q x86_64
          (
            cd package
            zip -qry ../release/ClickFlow-macOS.zip arm64 x64
          )
          unzip -t release/ClickFlow-macOS.zip
          sha256sum release/ClickFlow-macOS.zip | tee release/ClickFlow-macOS.zip.sha256

      - name: Upload the combined release package
        uses: actions/upload-artifact@v4
        with:
          name: clickflow-macos-release
          path: |
            release/ClickFlow-macOS.zip
            release/ClickFlow-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the verified macOS package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="clickflow-v2.0.0"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ClickFlow 2.0.0" \
              --notes "ClickFlow 2.0.0：定点点击、点击录制、动作编辑、循环回放与 Windows/macOS 原生包。"
          fi
          bytes="$(stat -c '%s' release/ClickFlow-macOS.zip)"
          sha256="$(sha256sum release/ClickFlow-macOS.zip | cut -d ' ' -f 1)"
          {
            echo "### ClickFlow macOS release asset"
            echo
            echo "- Bytes: $bytes"
            echo "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload clickflow-v2.0.0 release/ClickFlow-macOS.zip --clobber \
            --repo "$GITHUB_REPOSITORY"

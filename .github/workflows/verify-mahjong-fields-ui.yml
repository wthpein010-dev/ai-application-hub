name: Verify mahjong fields UI reference
on:
  push:
    branches: [main]
    paths:
      - 'projects/mahjong-fields-ui/**'
      - 'tests/mahjong-fields-ui-publication.test.mjs'
      - '.github/workflows/verify-mahjong-fields-ui.yml'
  workflow_dispatch:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check project scripts and complete project tests
        run: |
          for script in app.js state.js navigation.js support.js details.js; do
            node --check "projects/mahjong-fields-ui/demo/$script"
          done
          node --test tests/mahjong-fields-ui-publication.test.mjs
          node --test projects/mahjong-fields-ui/demo/tests/*.test.cjs
